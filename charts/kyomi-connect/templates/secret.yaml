{{- if and .Values.token (not .Values.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kyomi-connect.fullname" . }}-token
  labels:
    app.kubernetes.io/name: {{ include "kyomi-connect.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  token: {{ .Values.token | quote }}
{{- end }}
