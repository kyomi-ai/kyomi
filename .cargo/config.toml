# WASM-specific build configuration.
#
# build-std rebuilds the standard library from source for the wasm32 target,
# enabling panic=immediate-abort which strips all panic formatting strings
# and backtrace infrastructure — significant size savings for WASM.
#
# This only applies when building for wasm32-unknown-unknown (trunk builds).
# Server builds targeting the host are unaffected.
#
# Requires nightly: RUSTUP_TOOLCHAIN=nightly trunk build --release

[target.wasm32-unknown-unknown]
rustflags = ["--cfg=has_std", "-Zunstable-options", "-Cpanic=immediate-abort"]

[unstable]
build-std = ["std", "panic_abort", "core", "alloc"]
