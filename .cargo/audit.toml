# =============================================================================
# cargo-audit configuration
# =============================================================================
# Read automatically by `cargo audit` (and by the "Dependency Audit" CI job).
#
# Every entry in `ignore` below is a RUSTSEC advisory that is real but that we
# cannot currently act on, either because no patched version exists or because
# the vulnerable crate reaches us transitively through a dependency that has
# not yet released against a fixed version.
#
# RULES FOR THIS FILE
#   1. An ignore is a dated, justified exception — never a way to silence a
#      finding we could actually fix. If a fix exists, take the fix.
#   2. Every entry states: what reaches it, why we cannot move, and what has to
#      change upstream before it can be removed.
#   3. Re-check the whole list whenever `cargo update` runs. Entries whose
#      blocker has cleared must be removed in the same PR that clears them.
#
# Last full review: 2026-11-12
# =============================================================================

[advisories]
ignore = [
    # -------------------------------------------------------------------------
    # quick-xml 0.38.4 — no upstream release exists that we can reach
    # -------------------------------------------------------------------------
    # Path: citationberg 0.6.1 <- hayagriva 0.9.1 <- typst-library 0.14.2
    #       <- typst / typst-as-lib <- kyomi-agent (PDF report rendering).
    #
    # Patched in quick-xml >= 0.41.0, but citationberg 0.7.0 (its latest
    # release, verified against crates.io 2026-07-25) still declares
    # `quick-xml = "^0.38.1"`, and hayagriva 0.10.1 declares
    # `citationberg = "^0.7.0"`. Bumping typst 0.14 -> 0.15 therefore does NOT
    # move quick-xml off 0.38.x — it only changes which old version we pin.
    #
    # Impact is bounded: this copy of quick-xml only ever parses CSL citation
    # style files that ship inside typst itself. It never sees user input.
    #
    # Remove when: citationberg releases against quick-xml >= 0.41.
    "RUSTSEC-2026-0194", # quadratic run time checking a start tag for duplicate attribute names
    "RUSTSEC-2026-0195", # unbounded namespace-declaration allocation in NsReader (memory-exhaustion DoS)

    # -------------------------------------------------------------------------
    # rsa 0.9.10 and 0.10.0-rc.19 — the advisory has no patched version
    # -------------------------------------------------------------------------
    # Marvin Attack: potential key recovery through timing sidechannels.
    # The advisory's `patched` list is intentionally empty: the crypto-bigint
    # migration (RustCrypto/RSA#394) did not close it, and the advisory still
    # lists rsa 0.9.10 (latest stable) and 0.10.0-rc.18 (latest rc) as
    # affected as of 2026-09-12. The lockfile has 0.9.10 plus 0.10.0-rc.19 via
    # crypto-glue 0.2.2, so this ID-level ignore covers both.
    #
    # Reaches us through six direct dependents; none can move to a patched
    # release until the advisory has one:
    #   sqlx-mysql, jsonwebtoken, russh and internal-russh-forked-ssh-key,
    #   kyomi-datasource (via kyomi-connect) and superboring (web-push-native).
    #
    # Remove when: the advisory lists a patched version and every rsa copy in
    # Cargo.lock (0.9.10 and crypto-glue's 0.10.0-rc.x) moves to it; confirm
    # with `cargo audit` without this ignore.
    "RUSTSEC-2023-0071", # Marvin Attack: potential key recovery through timing sidechannels

    # -------------------------------------------------------------------------
    # russh 0.54.5 / russh-cryptovec 0.52.0 — deliberate pin, see KYO-212
    # -------------------------------------------------------------------------
    # Path: kyomi-datasource 1.6.2 (`ssh` feature) <- SSH tunnel support.
    #
    # Patched in russh >= 0.60.3, but ~/repos/kyomi-connect pins `russh = "0.54"`
    # on purpose (see the comment above the dependency in that repo's root
    # Cargo.toml). KYO-212's 2026-07-25 comment records the empirical failure:
    # russh >= 0.60.3 needs stable `hmac ^0.13` / `sha2 ^0.11`, while the
    # then-locked `crypto-glue 0.1.17` required the matching pre-releases.
    # This lockfile now has `crypto-glue 0.2.2` (via webauthn-rs 0.6.2), which
    # declares stable `hmac ^0.13.0` / `sha2 ^0.11` / `rsa ^0.10.0-rc.18`
    # (verified against crates.io 2026-11-05), so that specific conflict may
    # have cleared. The isolation test has not been re-run and the pin is
    # unchanged; see KYO-212.
    #
    # This is the only entry whose sole blocker is a pin we control. It needs
    # a kyomi-connect change plus a republish, and the coexistence question
    # has to be settled empirically first.
    #
    # Remove when: KYO-212 lands (russh bumped in kyomi-connect,
    # kyomi-datasource republished, `cargo update -p kyomi-datasource` here).
    "RUSTSEC-2026-0154", # russh: unbounded 32-bit allocation
    "RUSTSEC-2026-0153", # russh-cryptovec: unchecked CryptoVec allocation and growth handling

    # -------------------------------------------------------------------------
    # russh 0.54.5 — five advisories published 2026-11-12 (KYO-212 pin, again)
    # -------------------------------------------------------------------------
    # Same path and same blocker as the two russh entries above: kyomi-datasource
    # 1.6.2 (`ssh` feature, SSH tunnel to a ClickHouse bastion) pins russh 0.54.
    # The fixes need russh >= 0.65.0, i.e. the same kyomi-connect change and
    # republish tracked by KYO-212. Reachability assessed 2026-11-12 against the
    # advisory text (rustsec.org) and kyomi-datasource-1.6.2/src/ssh_tunnel.rs:
    #
    #   Our use is client-only: `russh::client::connect`, public-key auth
    #   (`authenticate_publickey`, never keyboard-interactive), and
    #   `channel_open_direct_tcpip` forwarding to a bastion host chosen by a
    #   workspace admin, with an optional pinned host-key fingerprint. The
    #   `TunnelClientHandler` implements only `check_server_key`; it keeps no
    #   per-channel state. `russh::server` appears only in the crate's own
    #   tests.
    #
    #   NOT reachable in production:
    #     RUSTSEC-2026-0495  agent *server* signs confirm-constrained keys
    #                        without calling `Agent::confirm` — we run no SSH
    #                        agent server.
    #     RUSTSEC-2026-0496  *server-side* keyboard-interactive response-count
    #                        allocation — we run no russh server.
    #
    #   Reachable only from the configured bastion (a compromised or hostile
    #   SSH host, or a network attacker where no host-key fingerprint is
    #   pinned). Impact is memory exhaustion in the Kyomi server process
    #   (availability); no data disclosure or code execution:
    #     RUSTSEC-2026-0493  decompression bomb if zlib compression is
    #                        negotiated; a server that offers no "none" method
    #                        can force it on the default client config.
    #     RUSTSEC-2026-0494  oversized KEXINIT name-lists allocate far more than
    #                        the packet size, before authentication.
    #     RUSTSEC-2026-0492  client `Handler` callbacks run for channels never
    #                        opened; our handler has no per-channel state, so
    #                        the described state-confusion/panic does not apply
    #                        (not exercised beyond that by us).
    #
    # Cheap mitigation to do in kyomi-connect together with the real fix:
    # restrict the client's preferred compression to "none" (removes 0493's
    # trigger) and require a pinned host-key fingerprint for every tunnel.
    #
    # Remove when: KYO-212 lands (russh >= 0.65.0 in kyomi-connect,
    # kyomi-datasource republished, `cargo update -p kyomi-datasource` here).
    # Revisit by 2026-12-10 even if it has not landed.
    "RUSTSEC-2026-0492", # russh: client Handler callbacks run for channels the client never opened
    "RUSTSEC-2026-0493", # russh: no limit on the size of a decompressed SSH packet
    "RUSTSEC-2026-0494", # russh: SSH message fields allocated before their size is checked
    "RUSTSEC-2026-0495", # russh: agent server signs confirm-constrained keys without Agent::confirm
    "RUSTSEC-2026-0496", # russh: pre-auth allocation from the keyboard-interactive response count

    # -------------------------------------------------------------------------
    # crypto-bigint 0.5.5 — held by the RustCrypto 0.13 ECC generation (KYO-955)
    # -------------------------------------------------------------------------
    # Path (verified 2026-11-05 with `cargo tree --locked -i
    # crypto-bigint@0.5.5 --target all`; the audit tree prints only the first
    # path):
    #   crypto-bigint 0.5.5 <- elliptic-curve 0.13.8
    #     <- ecdsa 0.16.9 <- internal-russh-forked-ssh-key 0.6.11
    #        <- russh 0.54.5 <- kyomi-datasource 1.6.2 (SSH tunnel)
    #     <- p256 0.13.2 / p384 0.13.1 / p521 0.13.3 / k256 0.13.4
    #        <- russh 0.54.5, jsonwebtoken 10.4.0 (kyomi-auth),
    #           web-push-native 0.4.0 -> jwt-simple 0.12.15 (kyomi-agent),
    #           kyomi-auth, kyomi-server and kyomi-ui (direct p256 0.13;
    #           kyomi-ui's is a dev-dependency)
    #        (primeorder 0.13.6 is a further intermediate under the nistp curves)
    #
    # Patched in crypto-bigint >= 0.7.6; 0.7.6 itself is yanked and 0.7.10 is
    # already in this lockfile via crypto-glue 0.2.2. The 0.13-generation
    # RustCrypto crates require crypto-bigint ^0.5, so the fix is a
    # semver-incompatible major change, not something `cargo update` can take.
    #
    # A fix is unreachable today, verified 2026-11-05:
    #   cargo update -p crypto-bigint@0.5.5 --precise 0.7.6 --dry-run -> fails
    #     (0.7.6 is yanked); --precise 0.7.10 --dry-run -> fails
    #     (elliptic-curve 0.13.8 requires crypto-bigint ^0.5)
    #   cargo update -p elliptic-curve@0.13.8 --precise 0.14.3 --dry-run
    #     -> fails (p256 0.13.2 requires ^0.13.1)
    #   cargo update -p ecdsa@0.16.9 --precise 0.17.0 --dry-run -> fails (^0.16)
    #   cargo update -p p256@0.13.2 --precise 0.14.0 --dry-run -> fails
    #     (kyomi-auth ^0.13)
    #   cargo update -p p384@0.13.1 --precise 0.14.0 --dry-run -> fails
    #     (jsonwebtoken ^0.13)
    #   cargo update -p p521@0.13.3 --precise 0.14.0 --dry-run -> fails
    #     (ssh-key ^0.13.3; russh and internal-russh-forked-ssh-key too)
    #   cargo update -p internal-russh-forked-ssh-key@0.6.11 --precise
    #     0.6.18+upstream-0.6.7 --dry-run -> fails (russh pins =0.6.11)
    #   cargo update -p jwt-simple@0.12.15 --precise 0.15.0 --dry-run -> fails
    #     (web-push-native requires ^0.12.6)
    #   plain `cargo update -p <crate>` for each of the above locks 0 packages,
    #   except jwt-simple: it moves 0.12.15 -> 0.12.17 (plus supporting
    #   crates) but stays on p256 0.13, so the conclusion is unchanged.
    # The newest upstream releases still keep the old generation (crates.io
    # API, 2026-11-05): jsonwebtoken 11.1.0 requires p256 ^0.13.2 and
    # p384 ^0.13.0; web-push-native 0.5.0 requires p256 ^0.13.2 and
    # jwt-simple ^0.12.17 (jwt-simple 0.15.0 is on 0.14, but is unreachable
    # through web-push-native). Kyomi's own direct p256 0.13 uses could be
    # bumped to 0.14 (a code change), but cannot clear the graph alone.
    #
    # The decisive holder is russh 0.54.5: it requires ecdsa ^0.16,
    # elliptic-curve ^0.13 and p256/p384/p521 ^0.13 itself, so even if every
    # other holder moved, crypto-bigint 0.5.5 would remain. russh is the
    # deliberate pin tracked by KYO-212 (kyomi-connect + republish), out of
    # scope for this ticket. Clearing that pin alone is also not sufficient:
    # jsonwebtoken and web-push-native would then be the blockers.
    #
    # Impact — checked against the call sites, 2026-11-05. crypto-bigint
    # 0.5.5 backs scalar/field arithmetic for the 0.13-generation ECC crates,
    # and secret-key operations are reachable:
    #   * ES256 signing of Kyomi Connect tokens with a long-lived P-256 key
    #     (crates/kyomi-auth/src/connect_token.rs, jsonwebtoken rust_crypto).
    #   * VAPID ES256 signing with the long-lived VAPID key plus P-256 ECE
    #     key agreement for Web Push (crates/kyomi-agent/src/web_push.rs,
    #     web-push-native + jwt-simple, whose ES256 path uses p256; k256 is
    #     only in the graph via jwt-simple's ES256K support). apps/server/src/
    #     routes/push.rs also derives the VAPID public key from the raw
    #     secret scalar.
    #   * SSH tunnel client: ECDSA host-key verification (public inputs) and
    #     ECDSA user-key signing when a user supplies an ECDSA key
    #     (kyomi-connect ssh_tunnel.rs, russh). Kyomi-generated tunnel keys
    #     are Ed25519 and russh's default KEX list has no nistp ECDH, so the
    #     ECDH paths are not exercised by the default tunnel configuration.
    #   * ES256 verification of Connect tokens (public inputs only).
    # Exploitation requires an attacker able to observe operation timing or
    # microarchitectural state (co-located process/VM, shared CPU, or a timing
    # oracle against the authenticated signing/derivation endpoints); the
    # advisory's branches are compiler/target dependent and request content
    # alone does not expose them. We cannot show the affected operations are
    # unreachable, so this is accepted residual risk, not a false positive.
    #
    # Remove when: `cargo audit` no longer reports RUSTSEC-2026-0387 with this
    # entry removed (currently it does; 0.5.5 is still in the graph). Confirm
    # the 0.13 generation is gone with `cargo tree --locked -i
    # crypto-bigint@0.5 --target all`, which fails with "did not match any
    # packages" once no 0.5.x remains (today it shows 0.5.5 under
    # elliptic-curve 0.13.8). Blocked on KYO-212 (russh), a jsonwebtoken
    # release on p256/p384 0.14 (or dropping its rust_crypto backend), a
    # web-push-native release on p256 0.14 + jwt-simple 0.15, and bumping the
    # workspace p256 dependency to 0.14 (kyomi-auth, kyomi-server, kyomi-ui).
    "RUSTSEC-2026-0387", # timing variability in operations intended to be constant-time

    # -------------------------------------------------------------------------
    # libsqlite3-sys 0.30.1 — bundled SQLite < 3.54.0 (KYO-966), revisit 2026-12-10
    # -------------------------------------------------------------------------
    # RUSTSEC-2026-0459 / CVE-2026-119375: SQLite before 3.54.0 can return
    # uninitialized page-cache memory when a process opens a database file
    # together with a sibling `-wal` file whose page size differs from the
    # database's. The attack vector is local and needs a crafted db+wal pair
    # written by a less trusted party and opened by the victim process.
    # Patched in libsqlite3-sys >= 0.39.0 (bundles SQLite 3.54.x); 0.6.0 to
    # 0.38.2 are affected.
    #
    # Path (verified 2026-11-09 with `cargo tree --locked -i
    # libsqlite3-sys@0.30.1`): libsqlite3-sys 0.30.1 <- sqlx-sqlite 0.8.6
    # <- sqlx 0.8.6 (workspace dependency, `sqlite` feature, bundled build)
    # <- kyomi-core, kyomi-auth, kyomi-agent, kyomi-server, kyomi-desktop and
    # the rest of the workspace. It is the only libsqlite3-sys in the lockfile.
    #
    # A fix is unreachable with a released sqlx, verified 2026-11-09:
    #   cargo update -p libsqlite3-sys --precise 0.39.1 --dry-run -> fails
    #     (sqlx-sqlite 0.8.6 requires libsqlite3-sys ^0.30.1)
    #   sqlx-sqlite 0.9.0 (latest release, published 2026-05-21; checked
    #     against crates.io 2026-11-09) declares
    #     libsqlite3-sys ">=0.30.1, <0.38.0", so even the 0.9 major migration
    #     cannot reach a patched 0.39.
    #   Only sqlx's unreleased `main` allows ">=0.30.1, <0.40.0". We do not pin
    #   a production dependency to an unreleased git revision.
    #
    # Reachability, checked against the call sites 2026-11-09:
    #   * The only non-test SQLite open is DbPool::connect
    #     (crates/kyomi-core/src/db.rs) for the app's own database: standalone
    #     and desktop mode open `<DATA_DIR>/kyomi.db` created by Kyomi itself
    #     (crates/kyomi-core/src/config.rs), or the operator-set DATABASE_URL.
    #     It runs with WAL mode, so a `-wal` sibling exists, but both files sit
    #     in a directory only the local user/operator controls.
    #   * No feature opens a user-supplied, uploaded or downloaded SQLite file:
    #     kyomi-datasource links only sqlx-postgres and sqlx-mysql, and no
    #     datasource type, import or attach path takes a SQLite file.
    #   * Production Postgres deployments never open SQLite; all other uses
    #     are `sqlite::memory:` in tests, which have no files.
    #   * Operator note: restoring or copying a `kyomi.db` together with a
    #     foreign `-wal` file (backup restore, shared DATA_DIR or
    #     DATABASE_URL=sqlite:) is the one realistic way to open a mismatched
    #     pair; only restore a database and its `-wal` from a trusted source.
    #     Kyomi has no in-app backup, restore or import feature.
    # Exploitation needs an attacker who can already write into the victim's
    # local data directory, which also hands them the database itself.
    #
    # Remove when: a released sqlx whose sqlx-sqlite allows libsqlite3-sys
    # >= 0.39 exists (sqlx main already does); then bump the workspace sqlx and
    # run `cargo audit` without this entry. Expiry: re-check by 2026-12-10.
    "RUSTSEC-2026-0459", # libsqlite3-sys via C SQLite CVE-2026-119375 (uninitialized memory with mismatched WAL page size)

]

# Informational advisories (unmaintained / unsound / yanked) are reported but do
# not fail the build. Most of the current crop are the gtk-rs GTK3 bindings
# pulled in by tauri for the desktop app, which we do not control. Promote this
# to a failure only alongside a plan to clear them.
informational_warnings = ["unmaintained", "unsound", "yanked"]
