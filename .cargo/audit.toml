# =============================================================================
# cargo-audit configuration
# =============================================================================
# Read automatically by `cargo audit` (and by the "Dependency Audit" CI job).
#
# Every entry in `ignore` below is a RUSTSEC advisory that is real but that we
# cannot currently act on, either because no patched version exists or because
# the vulnerable crate reaches us transitively through a dependency that has
# not yet released against a fixed version.
#
# RULES FOR THIS FILE
#   1. An ignore is a dated, justified exception — never a way to silence a
#      finding we could actually fix. If a fix exists, take the fix.
#   2. Every entry states: what reaches it, why we cannot move, and what has to
#      change upstream before it can be removed.
#   3. Re-check the whole list whenever `cargo update` runs. Entries whose
#      blocker has cleared must be removed in the same PR that clears them.
#
# Last full review: 2026-11-05
# =============================================================================

[advisories]
ignore = [
    # -------------------------------------------------------------------------
    # quick-xml 0.38.4 — no upstream release exists that we can reach
    # -------------------------------------------------------------------------
    # Path: citationberg 0.6.1 <- hayagriva 0.9.1 <- typst-library 0.14.2
    #       <- typst / typst-as-lib <- kyomi-agent (PDF report rendering).
    #
    # Patched in quick-xml >= 0.41.0, but citationberg 0.7.0 (its latest
    # release, verified against crates.io 2026-07-25) still declares
    # `quick-xml = "^0.38.1"`, and hayagriva 0.10.1 declares
    # `citationberg = "^0.7.0"`. Bumping typst 0.14 -> 0.15 therefore does NOT
    # move quick-xml off 0.38.x — it only changes which old version we pin.
    #
    # Impact is bounded: this copy of quick-xml only ever parses CSL citation
    # style files that ship inside typst itself. It never sees user input.
    #
    # Remove when: citationberg releases against quick-xml >= 0.41.
    "RUSTSEC-2026-0194", # quadratic run time checking a start tag for duplicate attribute names
    "RUSTSEC-2026-0195", # unbounded namespace-declaration allocation in NsReader (memory-exhaustion DoS)

    # -------------------------------------------------------------------------
    # rsa 0.9.10 — no patched version exists, at all
    # -------------------------------------------------------------------------
    # Marvin Attack: potential key recovery through timing sidechannels.
    # The advisory lists NO patched versions; the RustCrypto fix landed only in
    # the 0.10.0-rc line, which is still pre-release.
    #
    # Reaches us through five independent paths, none of which we control:
    #   sqlx-mysql, jsonwebtoken, crypto-glue (webauthn-rs / passkeys),
    #   superboring (web-push-native), and ssh-key (russh).
    #
    # Remove when: rsa 0.10 ships stable AND the crates above adopt it.
    "RUSTSEC-2023-0071", # Marvin Attack: potential key recovery through timing sidechannels

    # -------------------------------------------------------------------------
    # russh 0.54.5 / russh-cryptovec 0.52.0 — deliberate pin, see KYO-212
    # -------------------------------------------------------------------------
    # Path: kyomi-datasource 1.6.0 (`ssh` feature) <- SSH tunnel support.
    #
    # Patched in russh >= 0.60.3, but ~/repos/kyomi-connect pins `russh = "0.54"`
    # on purpose (see the comment above the dependency in that repo's root
    # Cargo.toml). russh >= 0.55 moved to the pre-release RustCrypto generation
    # (`generic-array ^1.3.3`, `rsa =0.10.0-rc.18`), while `crypto-glue 0.1.17`
    # — which webauthn-rs pulls in for passkeys — still requires
    # `generic-array =0.14.7` and `rsa ^0.9.10`. Both verified against
    # crates.io on 2026-07-25.
    #
    # This is the one entry in this file that is OURS to fix rather than
    # upstream's. It needs a kyomi-connect change plus a republish, and the
    # coexistence question has to be settled empirically first.
    #
    # Remove when: KYO-212 lands (russh bumped in kyomi-connect,
    # kyomi-datasource republished, `cargo update -p kyomi-datasource` here).
    "RUSTSEC-2026-0154", # russh: unbounded 32-bit allocation
    "RUSTSEC-2026-0153", # russh-cryptovec: unchecked CryptoVec allocation and growth handling

    # -------------------------------------------------------------------------
    # crypto-bigint 0.5.5 — held by the RustCrypto 0.13 ECC generation (KYO-955)
    # -------------------------------------------------------------------------
    # Path (verified 2026-11-05 with `cargo tree --locked -i
    # crypto-bigint@0.5.5 --target all`; the audit tree prints only the first
    # path):
    #   crypto-bigint 0.5.5 <- elliptic-curve 0.13.8
    #     <- ecdsa 0.16.9 <- internal-russh-forked-ssh-key 0.6.11
    #        <- russh 0.54.5 <- kyomi-datasource 1.6.2 (SSH tunnel)
    #     <- p256 0.13.2 / p384 0.13.1 / p521 0.13.3 / k256 0.13.4
    #        <- russh 0.54.5, jsonwebtoken 10.4.0 (kyomi-auth),
    #           web-push-native 0.4.0 -> jwt-simple 0.12.15 (kyomi-agent),
    #           kyomi-auth and kyomi-server (direct p256 0.13)
    #
    # Patched in crypto-bigint >= 0.7.6; 0.7.6 itself is yanked and 0.7.10 is
    # already in this lockfile via crypto-glue 0.2.2. The 0.13-generation
    # RustCrypto crates require crypto-bigint ^0.5, so the fix is a
    # semver-incompatible major change, not something `cargo update` can take.
    #
    # A fix is unreachable today, verified 2026-11-05:
    #   cargo update -p crypto-bigint@0.5.5 --precise 0.7.6 -> fails
    #     (elliptic-curve 0.13.8 requires crypto-bigint ^0.5; 0.7.6 yanked)
    #   cargo update -p elliptic-curve@0.13.8 --precise 0.14.3 -> fails
    #     (p256 0.13.2 requires ^0.13.1)
    #   cargo update -p ecdsa@0.16.9 --precise 0.17.0 -> fails (^0.16)
    #   cargo update -p p256@0.13.2 --precise 0.14.0 -> fails (kyomi-auth ^0.13)
    #   cargo update -p p384@0.13.1 --precise 0.14.0 -> fails
    #     (jsonwebtoken ^0.13)
    #   cargo update -p p521@0.13.3 --precise 0.14.0 -> fails
    #     (ssh-key ^0.13.3; russh and internal-russh-forked-ssh-key too)
    #   cargo update -p internal-russh-forked-ssh-key@0.6.11 --precise
    #     0.6.18+upstream-0.6.7 -> fails (russh pins =0.6.11)
    #   cargo update -p jwt-simple@0.12.15 --precise 0.15.0 -> fails
    #     (web-push-native requires ^0.12.6)
    #   plain `cargo update -p <crate>` for each of the above locks 0 packages.
    # The newest upstream releases still keep the old generation (crates.io
    # API, 2026-11-05): jsonwebtoken 11.1.0 requires p256 ^0.13.2 and
    # p384 ^0.13.0; web-push-native 0.5.0 requires p256 ^0.13.2 and
    # jwt-simple ^0.12.17 (jwt-simple 0.15.0 is on 0.14, but is unreachable
    # through web-push-native). Kyomi's own direct p256 0.13 uses could be
    # bumped to 0.14 (a code change), but cannot clear the graph alone.
    #
    # The decisive holder is russh 0.54.5: it requires ecdsa ^0.16,
    # elliptic-curve ^0.13 and p256/p384/p521 ^0.13 itself, so even if every
    # other holder moved, crypto-bigint 0.5.5 would remain. russh is the
    # deliberate pin tracked by KYO-212 (kyomi-connect + republish), out of
    # scope for this ticket. Clearing that pin alone is also not sufficient:
    # jsonwebtoken and web-push-native would then be the blockers.
    #
    # Impact — checked against the call sites, 2026-11-05. crypto-bigint
    # 0.5.5 backs scalar/field arithmetic for the 0.13-generation ECC crates,
    # and secret-key operations are reachable:
    #   * ES256 signing of Kyomi Connect tokens with a long-lived P-256 key
    #     (crates/kyomi-auth/src/connect_token.rs, jsonwebtoken rust_crypto).
    #   * VAPID ES256 signing with the long-lived VAPID key plus P-256 ECE
    #     key agreement for Web Push (crates/kyomi-agent/src/web_push.rs,
    #     web-push-native + jwt-simple/k256). apps/server/src/routes/push.rs
    #     also derives the VAPID public key from the raw secret scalar.
    #   * SSH tunnel client: ECDSA host-key verification (public inputs) and
    #     ECDSA user-key signing when a user supplies an ECDSA key
    #     (kyomi-connect ssh_tunnel.rs, russh). Kyomi-generated tunnel keys
    #     are Ed25519 and russh's default KEX list has no nistp ECDH, so the
    #     ECDH paths are not exercised by the default tunnel configuration.
    #   * ES256 verification of Connect tokens (public inputs only).
    # Exploitation requires an attacker able to observe operation timing or
    # microarchitectural state (co-located process/VM or shared CPU); the
    # advisory's branches are compiler/target dependent and request content
    # alone does not expose them. We cannot show the affected operations are
    # unreachable, so this is accepted residual risk, not a false positive.
    #
    # Remove when: no package in Cargo.lock requires the RustCrypto 0.13 ECC
    # generation — `cargo tree --locked -i elliptic-curve@0.13.8 --target
    # all` prints nothing and `cargo audit` no longer reports this ID without
    # the ignore. Blocked on KYO-212 (russh), a jsonwebtoken release on
    # p256/p384 0.14 (or dropping its rust_crypto backend), a web-push-native
    # release on p256 0.14 + jwt-simple 0.15, and bumping kyomi-auth's and
    # kyomi-server's direct p256 to 0.14.
    "RUSTSEC-2026-0387", # timing variability in operations intended to be constant-time

    # -------------------------------------------------------------------------
    # rustls-webpki 0.101.7 — upstream dead end
    # -------------------------------------------------------------------------
    # Path: rustls 0.21.12 <- tokio-rustls 0.24.1 <- tiberius 0.12.3
    #       <- kyomi-datasource (SQL Server driver).
    #
    # Patched in rustls-webpki >= 0.103.12/0.103.13, which requires rustls
    # >= 0.23. tiberius 0.12.3 is its latest release (verified 2026-07-25) and
    # still declares `tokio-rustls = "^0.24.0"`, pinning rustls to 0.21.
    #
    # Note this is the *SQL Server* TLS stack only. Kyomi's own HTTP/TLS paths
    # use a current rustls (rustls-webpki 0.103.13 is also in the tree).
    #
    # Remove when: tiberius releases against tokio-rustls >= 0.26 / rustls
    # >= 0.23, or kyomi-connect switches its SQL Server driver off tiberius.
    "RUSTSEC-2026-0098", # name constraints for URI names were incorrectly accepted
    "RUSTSEC-2026-0099", # name constraints were accepted for certificates asserting a wildcard name
    "RUSTSEC-2026-0104", # reachable panic in certificate revocation list parsing

    # -------------------------------------------------------------------------
    # rkyv 0.7.46 — never compiled: unactivated optional dependency (KYO-317)
    # -------------------------------------------------------------------------
    # Path: rkyv 0.7.46 <- optional dep of rust_decimal 1.42.1 (behind
    #       rust_decimal's own `rkyv` feature) <- kyomi-datasource 1.6.0 and
    #       sqlx-core 0.8.6.
    #
    # Unlike every other entry in this file, the problem here isn't that no
    # fix exists — it's that the vulnerable code is never compiled into any
    # Kyomi artifact in the first place. rust_decimal's `rkyv` feature is not
    # part of its `default = ["serde", "std"]` set, and nothing in this
    # workspace enables it. `cargo tree -i rkyv --target all --all-features`
    # (verified 2026-08-06) prints only:
    #
    #   warning: nothing to print.
    #
    # rkyv shows up in Cargo.lock anyway because cargo records the full
    # resolution graph, including optional dependencies that no enabled
    # feature activates, and `cargo-audit` scans that lockfile with no
    # feature awareness — it cannot tell an activated dependency from a
    # merely-resolvable one.
    #
    # Neither available fix applies. rust_decimal 1.42.1 is the newest
    # release (`cargo update -p rust_decimal --dry-run` -> `Locking 0
    # packages`, verified 2026-08-06); its `rkyv` feature still requires
    # `rkyv = "^0.7.46"` per rust_decimal's own Cargo.toml — no release has
    # moved that feature to rkyv 0.8. Forcing the bump directly is also
    # rejected: `cargo update -p rkyv --precise 0.8.17` fails with "candidate
    # versions found which didn't match: 0.8.17 ... required by package
    # rust_decimal v1.42.1" (verified 2026-08-06).
    #
    # Remove when: rust_decimal publishes a release whose `rkyv` feature
    # depends on `rkyv >= 0.8.17`, at which point a plain `cargo update -p
    # rust_decimal` clears it.
    "RUSTSEC-2026-0235", # Insufficient archive validation can cause out-of-bounds reads in archives containing Rc/Arc
]

# Informational advisories (unmaintained / unsound / yanked) are reported but do
# not fail the build. Most of the current crop are the gtk-rs GTK3 bindings
# pulled in by tauri for the desktop app, which we do not control. Promote this
# to a failure only alongside a plan to clear them.
informational_warnings = ["unmaintained", "unsound", "yanked"]
