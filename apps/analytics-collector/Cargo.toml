[package]
name = "kyomi-collector"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clickhouse = { version = "0.13", features = ["rustls-tls-ring", "rustls-tls-native-roots"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
woothee = "0.13"
hex = "0.4"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
chrono = "0.4"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
getrandom = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
