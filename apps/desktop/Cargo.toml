[package]
name = "kyomi-desktop"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Kyomi Desktop — native desktop app powered by Tauri"

[[bin]]
name = "kyomi-desktop"
path = "src/main.rs"

[dependencies]
kyomi-core = { workspace = true }
kyomi-auth = { workspace = true }
kyomi-embed = { workspace = true }
kyomi-datasource-server = { workspace = true }
kyomi-agent = { workspace = true }
kyomi-server = { path = "../server", default-features = false, features = [] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2.10", features = ["wry", "devtools", "image-png"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
portpicker = "0.1"
dirs = "6"

[build-dependencies]
tauri-build = "2.5"
