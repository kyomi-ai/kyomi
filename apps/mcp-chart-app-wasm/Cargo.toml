# This crate is NOT part of the kyomi workspace — it targets wasm32-unknown-unknown
# and is built independently by Trunk.
[workspace]

[package]
name = "mcp-chart-app-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
# ChartML — pinned to <5.1 because chartml-core 5.1 added stroke_dashoffset
# to ChartElement::Path but the chart renderer crates haven't been published
# with the updated field yet. Lift the pin after chartml publishes all renderer
# crates at >=5.1.
chartml-core = ">=5, <5.1"
chartml-chart-cartesian = "5"
chartml-chart-pie = "5"
chartml-chart-scatter = "5"
chartml-chart-metric = "5"
chartml-leptos = "5"

kyomi-ui-components = { path = "../../crates/kyomi-ui-components" }
kyomi-chart-theme = { path = "../../crates/kyomi-chart-theme" }
send_wrapper = "0.6"

leptos = { version = "0.8", features = ["csr"] }
web-sys = { version = "0.3", features = [
    "HtmlElement", "HtmlInputElement", "HtmlBodyElement", "Document", "Window", "Element",
    "CustomEvent", "CustomEventInit", "Event", "EventTarget",
    "CssStyleDeclaration", "DomTokenList", "DomRectReadOnly",
    "Navigator", "Clipboard",
    "MessageEvent",
    "ResizeObserver", "ResizeObserverEntry",
] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
console_error_panic_hook = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

