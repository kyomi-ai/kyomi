# This crate is NOT part of the kyomi workspace — it targets wasm32-unknown-unknown
# and is built independently by Trunk.
[workspace]

[package]
name = "mcp-chart-app-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
# ChartML comes from crates.io. This crate is its own workspace with its own
# committed Cargo.lock, so its versions resolve independently of the root
# workspace. The chart renderers (chartml-chart-*) are not listed here: they
# come in through kyomi-chart-theme, whose `register_kyomi_renderers` is the one
# definition of which renderers Kyomi registers. To test a local chartml
# checkout, put a [patch.crates-io] override for every chartml crate in this
# app's Cargo.lock in ~/.cargo/config.toml (there is deliberately no patch block
# here). build.sh's `cargo metadata --locked` check
# then fails until you regenerate this lock under the override with
# `cargo update -p <each patched crate>`; discard that lock change before
# committing. See CLAUDE.md, "External Crate Dependencies".
chartml-core = "5"
chartml-leptos = "5.0.3"

kyomi-ui-components = { path = "../../crates/kyomi-ui-components" }
kyomi-chart-theme = { path = "../../crates/kyomi-chart-theme" }
send_wrapper = "0.6"

leptos = { version = "0.8", features = ["csr"] }
web-sys = { version = "0.3", features = [
    "HtmlElement", "HtmlInputElement", "HtmlBodyElement", "Document", "Window", "Element",
    "CustomEvent", "CustomEventInit", "Event", "EventTarget",
    "CssStyleDeclaration", "DomTokenList", "DomRectReadOnly",
    "Navigator", "Clipboard",
    "MessageEvent",
    "ResizeObserver", "ResizeObserverEntry",
] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reports the field path of a deserialization failure. serde_json's own error
# from a `Value` names the bad type but not where it sat, so a host context that
# fails to parse could not say which part of it the app could not read.
serde_path_to_error = "0.1.20"
serde_yaml = "0.9"
console_error_panic_hook = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

