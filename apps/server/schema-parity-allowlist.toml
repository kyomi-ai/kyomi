# ---------------------------------------------------------------------------
# App-generated primary keys with a redundant (and on SQLite, absent)
# database-side default.
#
# These IDs are always supplied explicitly by the Rust application layer on
# both backends (never left to the database to generate). Postgres carries
# a DB-side default as a historical convenience/safety net that the app
# path never actually exercises; SQLite's migrations never added one.
# ---------------------------------------------------------------------------

[[entry]]
table = "datasource_configs"
column = "id"
reason = "Postgres default `('ds-' || SUBSTRING(md5(random()::text), 1, 24))` is a redundant safety net — kyomi_core/kyomi_auth always generate and supply the id explicitly on insert (SQLite has no such default and works the same way). See apps/server/migrations/20260215000000_baseline.sql."

[[entry]]
table = "workspace_knowledge_chunks"
column = "chunk_id"
reason = "Postgres `chunk_id uuid DEFAULT gen_random_uuid()` was not touched by 20260315000000_uuid_columns_to_text.sql (that migration only covered agent_learnings, charts, collections, oauth_clients, analytics_sites). The column still classifies as Text on both backends (uuid folds into the Text class) and the application always supplies chunk_id explicitly on insert, so the Postgres default is redundant/dead code exactly like datasource_configs.id above — not a live divergence."

[[entry]]
table = "ownership_transfers"
column = "expires_at"
reason = "Postgres default `(now() + '7 days'::interval)` — SQLite has no INTERVAL arithmetic; apps/server/migrations-sqlite/00001_baseline.sql computes the same 7-day expiry in the Rust application layer before insert instead (see its 'skip INTERVAL default' comment)."

[[entry]]
