# Schema-parity allowlist (KYO-206)
#
# The `schema_parity` CI check (crates/kyomi-core/tests/schema_parity.rs) runs
# the *real* embedded sqlx::migrate! chains from crates/kyomi-core/src/db.rs
# against a scratch Postgres database and a fresh in-memory SQLite database,
# introspects the resulting schemas, and fails the build if any table or
# column is present on one backend and not the other (or differs in
# normalized type class / nullability / default-presence) — unless the
# specific `table` (or `table` + `column`) pair is listed here.
#
# This file exists because two divergences of exactly this shape already
# shipped to production undetected (KYO-200): `collections.doc_type` and
# `thinking_event_details` existed only on Postgres, silently breaking
# self-hosted SQLite deployments.
#
# Every entry below must be as narrow as possible (a specific table.column,
# not a whole table, unless the *entire* table is a one-sided construct) and
# must carry a `reason` explaining why the divergence is deliberate rather
# than a bug. Do not add an entry to make this check pass without genuinely
# verifying the divergence is intentional — that defeats the purpose of the
# check. If a divergence looks like a bug, fix the migration; don't
# allowlist it.
#
# Omit `column` to waive an entire table (only for tables that exist on one
# backend by design, with no reasonable per-column analogue on the other).

# ---------------------------------------------------------------------------
# Postgres full-text search columns (tsvector) — no SQLite analogue.
#
# SQLite has no tsvector/GIN equivalent. Full-text search on self-hosted
# SQLite is implemented per-table via FTS5 virtual tables (see
# `agent_learnings_fts` below) kept in sync by triggers, or (for tables
# without an FTS5 mirror) simply not offered on SQLite. These columns are
# populated by Postgres triggers (agent_learnings_search_vector_update,
# dashboards_search_vector_update, chat_messages_content_tsv_trigger) defined
# in apps/server/migrations/20260215000000_baseline.sql and have no SQLite
# counterpart by design — SQLite migrations explicitly document this via
# inline "skip ... tsvector column" comments.
# ---------------------------------------------------------------------------

[[entry]]
table = "agent_learnings"
column = "search_vector"
reason = "Postgres tsvector column populated by agent_learnings_search_vector_update() trigger. SQLite full-text search for agent_learnings is implemented separately via the agent_learnings_fts FTS5 virtual table (see below), not a mirrored column."

[[entry]]
table = "dashboards"
column = "search_vector"
reason = "Postgres tsvector column populated by dashboards_search_vector_update() trigger. No SQLite analogue — apps/server/migrations-sqlite/00001_baseline.sql explicitly documents 'skip search_vector tsvector column'."

[[entry]]
table = "chat_messages"
column = "content_tsv"
reason = "Postgres tsvector column populated by chat_messages_content_tsv_trigger() trigger. No SQLite analogue — apps/server/migrations-sqlite/00001_baseline.sql explicitly documents 'skip content_tsv tsvector column'."

# ---------------------------------------------------------------------------
# SQLite FTS5 virtual table replacing Postgres tsvector/GIN search for
# agent_learnings — no Postgres analogue.
# ---------------------------------------------------------------------------

[[entry]]
table = "agent_learnings_fts"
reason = "SQLite FTS5 virtual table (apps/server/migrations-sqlite/00001_baseline.sql) that mirrors agent_learnings.insight/context for full-text search, replacing the Postgres tsvector + GIN index approach (agent_learnings.search_vector). No Postgres analogue by design."

# FTS5 shadow tables. SQLite auto-creates these alongside the virtual table
# above (external-content mode: content='agent_learnings') to store the
# inverted index, per-row size accounting, and module config. They are an
# implementation detail of agent_learnings_fts, not something anyone
# declared explicitly, and have no Postgres analogue for the same reason
# agent_learnings_fts itself doesn't.

[[entry]]
table = "agent_learnings_fts_data"
reason = "FTS5 shadow table auto-created by SQLite for the agent_learnings_fts virtual table (stores the inverted index segments). No Postgres analogue."

[[entry]]
table = "agent_learnings_fts_idx"
reason = "FTS5 shadow table auto-created by SQLite for the agent_learnings_fts virtual table (segment index). No Postgres analogue."

[[entry]]
table = "agent_learnings_fts_docsize"
reason = "FTS5 shadow table auto-created by SQLite for the agent_learnings_fts virtual table (per-row size accounting, external-content mode). No Postgres analogue."

[[entry]]
table = "agent_learnings_fts_config"
reason = "FTS5 shadow table auto-created by SQLite for the agent_learnings_fts virtual table (module configuration). No Postgres analogue."

# ---------------------------------------------------------------------------
# Postgres SERIAL/BIGSERIAL integer primary keys vs SQLite
# `INTEGER PRIMARY KEY AUTOINCREMENT`.
#
# These are the two backends' respective idioms for an auto-incrementing
# integer surrogate key, and they introspect differently in two ways that
# are NOT bugs:
#
#   1. has_default: Postgres SERIAL/BIGSERIAL desugars to
#      `INTEGER/BIGINT NOT NULL DEFAULT nextval('..._seq')` — a real
#      column default. SQLite's AUTOINCREMENT is a keyword modifier on the
#      rowid alias, not a DEFAULT clause, so PRAGMA table_info reports
#      dflt_value = NULL for it.
#   2. nullable: an `INTEGER PRIMARY KEY` column in SQLite is a rowid
#      alias; PRAGMA table_info reports notnull = 0 for it even though the
#      column can never actually hold NULL (inserting NULL triggers
#      auto-assignment of a new rowid rather than storing NULL). This is
#      documented SQLite behavior, not an enforcement gap.
#
# Both backends still guarantee a unique, non-null, auto-generated integer
# identity for these columns — this is a representation difference, not a
# semantic one.
# ---------------------------------------------------------------------------

[[entry]]
table = "api_usage_log"
column = "id"
reason = "Postgres SERIAL vs SQLite INTEGER PRIMARY KEY AUTOINCREMENT — see the SERIAL/AUTOINCREMENT note above this section."

