# Schema-parity allowlist (KYO-206)
#
# The `schema_parity` CI check (crates/kyomi-core/tests/schema_parity.rs) runs
# the *real* embedded sqlx::migrate! chains from crates/kyomi-core/src/db.rs
# against a scratch Postgres database and a fresh in-memory SQLite database,
# introspects the resulting schemas, and fails the build if any table or
# column is present on one backend and not the other (or differs in
# normalized type class / nullability / default-presence) — unless the
# specific `table` (or `table` + `column`) pair is listed here.
#
# This file exists because two divergences of exactly this shape already
# shipped to production undetected (KYO-200): `collections.doc_type` and
# `thinking_event_details` existed only on Postgres, silently breaking
# self-hosted SQLite deployments.
#
# Every entry below must be as narrow as possible (a specific table.column,
# not a whole table, unless the *entire* table is a one-sided construct) and
# must carry a `reason` explaining why the divergence is deliberate rather
# than a bug. Do not add an entry to make this check pass without genuinely
# verifying the divergence is intentional — that defeats the purpose of the
# check. If a divergence looks like a bug, fix the migration; don't
# allowlist it.
#
# Omit `column` to waive an entire table (only for tables that exist on one
# backend by design, with no reasonable per-column analogue on the other).
#
# KYO-296 extended this check (and this file) to also compare primary keys,
# unique indexes/constraints (including their key *expressions*, so
# `lower(name)` vs `name` is caught), and foreign keys (source/target
# columns plus ON DELETE/ON UPDATE actions). An entry may waive at most one
# of `column` / `index` / `foreign_key` (or none, to waive the whole table):
#   - `index = "<name>"` waives that index/unique-constraint on `table`,
#     matched against either backend's name.
#   - `foreign_key = "<comma-joined source column list>"` waives that FK on
#     `table` — SQLite foreign keys are unnamed, so the source column list
#     (in migration order) is the only stable cross-backend key.
#
# Two dimensions are deliberately NOT compared, and never will be via this
# file:
#   - Non-unique indexes: a missing one is a performance issue, not a
#     correctness one, and the two chains spell hundreds of them
#     differently — enforcing parity there would bloat this file into
#     meaninglessness. The one exception (handled in code, not here): a
#     name-matched pair where at least one side is UNIQUE is still compared,
#     since "UNIQUE on one backend, plain index on the other" is a real
#     correctness divergence.
#   - Check constraints: Postgres exposes them via pg_get_constraintdef, but
#     SQLite only as raw DDL text in sqlite_master.sql, which would need a
#     real SQL parser to compare — and even then, Postgres desugars
#     `x IN (a, b)` to `x = ANY (ARRAY[...])`, so a naive text comparison
#     would either manufacture false mismatches or (worse) a normalizer
#     built to paper over that would risk asserting different constraints
#     equal. See crates/kyomi-core/tests/schema_parity.rs's module doc for
#     the full reasoning.

# ---------------------------------------------------------------------------
# Postgres full-text search columns (tsvector) — no SQLite analogue.
#
# SQLite has no tsvector/GIN equivalent. Full-text search on self-hosted
# SQLite is implemented per-table via FTS5 virtual tables (see
# `agent_learnings_fts` below) kept in sync by triggers, or (for tables
# without an FTS5 mirror) simply not offered on SQLite. These columns are
# populated by Postgres triggers (agent_learnings_search_vector_update,
# dashboards_search_vector_update, chat_messages_content_tsv_trigger) defined
# in apps/server/migrations/20260215000000_baseline.sql and have no SQLite
# counterpart by design — SQLite migrations explicitly document this via
# inline "skip ... tsvector column" comments.
# ---------------------------------------------------------------------------

[[entry]]
table = "agent_learnings"
column = "search_vector"
reason = "Postgres tsvector column populated by agent_learnings_search_vector_update() trigger. SQLite full-text search for agent_learnings is implemented separately via the agent_learnings_fts FTS5 virtual table (see below), not a mirrored column."

[[entry]]
table = "dashboards"
column = "search_vector"
reason = "Postgres tsvector column populated by dashboards_search_vector_update() trigger. No SQLite analogue — apps/server/migrations-sqlite/00001_baseline.sql explicitly documents 'skip search_vector tsvector column'."

