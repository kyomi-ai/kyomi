[package]
name = "kyomi-server"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "kyomi"
path = "src/main.rs"

[features]
default = ["slack"]
slack = ["dep:kyomi-slack", "kyomi-ui/slack"]

[dependencies]
kyomi-slack = { path = "../../enterprise/kyomi-slack", optional = true }
kyomi-core = { workspace = true }
kyomi-auth = { workspace = true }
kyomi-ui = { workspace = true, features = ["ssr"] }
leptos = "0.8"
leptos_axum = "0.8"
kyomi-embed = { workspace = true }
kyomi-datasource-server = { workspace = true }
kyomi-datasource-drivers = { workspace = true }
kyomi-agent = { workspace = true }
kyomi-knowledge = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
pgvector = { workspace = true }
redis = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
webauthn-rs = { workspace = true }
webauthn-rs-proto = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
futures-util = { workspace = true }
async-stripe = { workspace = true }
async-stripe-webhook = { workspace = true }
async-stripe-billing = { workspace = true }
async-stripe-shared = { workspace = true }
async-stripe-types = { workspace = true }
regex = { workspace = true }
similar = { workspace = true }
serde_urlencoded = { workspace = true }
chrono-tz = { workspace = true }
dashmap = { workspace = true }
serde_yaml = { workspace = true }
p256 = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-buffer = { workspace = true }
async-trait = { workspace = true }
rust-embed = { workspace = true }
tokio-tungstenite = { version = "0.28", default-features = false }

[dev-dependencies]
kyomi-core = { workspace = true, features = ["test-helpers"] }
kyomi-auth = { workspace = true }
kyomi-embed = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
