  <body>

    <!-- PWA Recovery Script: Handles stale cache white screen on iOS -->
    <script>
      (function() {
        // Check if we've been in a white screen state for too long
        var startTime = Date.now();
        var CHECK_TIMEOUT = 5000; // 5 seconds
        var RECOVERY_KEY = 'kyomi_pwa_recovery_attempted';

        // If we already tried recovery recently, don't loop
        var lastRecovery = localStorage.getItem(RECOVERY_KEY);
        if (lastRecovery && (Date.now() - parseInt(lastRecovery, 10)) < 60000) {
          console.log('PWA recovery attempted recently, skipping');
          return;
        }

        // Set a timeout to check if app loaded
        setTimeout(function() {
          var root = document.getElementById('root');
          // If root is empty or has no children, we have a white screen
          if (root && (!root.children.length || root.innerHTML.trim() === '')) {
            console.warn('White screen detected, clearing caches and reloading...');
            localStorage.setItem(RECOVERY_KEY, Date.now().toString());

            // Clear service workers and caches
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(reg) { reg.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }

            // Wait a moment then reload
            setTimeout(function() {
              window.location.reload();
            }, 500);
          }
        }, CHECK_TIMEOUT);
      })();
    </script>
