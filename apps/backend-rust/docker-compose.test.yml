services:
  test-postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kyomi_test
      POSTGRES_USER: kyomi_test
      POSTGRES_PASSWORD: test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyomi_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  test-redis:
    image: docker.io/redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
