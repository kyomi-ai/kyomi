[package]
name = "kyomi-ui"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
# Server-side rendering — includes leptos_axum, accesses DB/services directly
ssr = [
    "leptos/ssr",
    "dep:leptos_axum",
    "leptos_router/ssr",
    "leptos_meta/ssr",
    "dep:kyomi-core",
    "dep:kyomi-auth",
    "dep:axum",
    "dep:chrono",
    "dep:sqlx",
]
# Client-side hydration — compiles to WASM, no server deps
hydrate = [
    "leptos/hydrate",
    "leptos/csr",
]
# Slack integration — adds server functions for Slack connection management
slack = ["dep:kyomi-slack", "dep:chrono"]

[dependencies]
# Leptos framework
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_axum = { version = "0.8", optional = true }

# Serialization (shared types cross server/client boundary)
serde = { workspace = true }
serde_json = { workspace = true }

# Icons — Lucide icon set (same as lucide-react in the React frontend)
leptos_icons = "0.7"
icondata_core = "0.1"
icondata_lu = "0.1"

# WASM error handling (client-only, but always compiled — no-op on server)
console_error_panic_hook = "0.1"

# Browser DOM access (for theme toggling, clipboard, etc.)
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "Element", "DomTokenList", "MediaQueryList", "Location", "RequestCredentials", "Navigator", "Clipboard"] }

# WASM interop (session refresh via JS fetch)
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Base64 encoding (for Cursor deep-link config)
base64 = { workspace = true }

# Async timers for WASM (copy feedback reset)
gloo-timers = "0.3"

# Logging
tracing = { workspace = true }

# Internal crates (server-only — gated behind ssr feature)
kyomi-core = { workspace = true, optional = true }
kyomi-auth = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

# Enterprise crates (optional, behind feature flags)
kyomi-slack = { path = "../../enterprise/kyomi-slack", optional = true }
chrono = { workspace = true, optional = true }  # used by: slack, ssr (TOTP enabled_at)

[dev-dependencies]
kyomi-core = { workspace = true, features = ["test-helpers"] }
kyomi-auth = { workspace = true }
tokio = { workspace = true }
