[package]
name = "kyomi-ui"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Server-side rendering — includes leptos_axum, accesses DB/services directly
ssr = [
    "leptos/ssr",
    "dep:leptos_axum",
    "leptos_router/ssr",
    "leptos_meta/ssr",
    "dep:kyomi-core",
    "dep:kyomi-auth",
    "dep:kyomi-agent",
    "dep:kyomi-embed",
    "dep:kyomi-knowledge",
    "dep:kyomi-datasource-server",
    "dep:kyomi-connect-protocol",
    "dep:tokio",
    "dep:tokio-util",
    "dep:dashmap",
    "dep:uuid",
    "dep:axum",
    "dep:sqlx",
    "dep:webauthn-rs",
    "dep:sha2",
    "dep:hmac",
    "dep:arrow-schema",
    "dep:arrow-array",
    "dep:arrow-ipc",
    "dep:futures-util",
    "dep:reqwest",
]
# Client-side hydration — compiles to WASM, no server deps
hydrate = [
    "leptos/hydrate",
    "leptos/csr",
]
# Slack integration — adds server functions for Slack connection management
slack = ["dep:kyomi-slack"]

[dependencies]
# Leptos framework
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_axum = { version = "0.8", optional = true }

# Serialization (shared types cross server/client boundary)
serde = { workspace = true }
serde_json = { workspace = true }
kyomi-types = { workspace = true }

# Shared UI component primitives (Select, Button, Card, etc.) — no server deps.
kyomi-ui-components = { workspace = true }

# Icons — Phosphor icon set. Uses the Light weight for inactive nav items
# and the Fill weight for active nav items (see NavItem in components/layout.rs).
# DESIGN.md convention: Light for form/utility icons, Regular for buttons,
# Fill for active-state moments, Duotone for brand illustrations at 64px+.
phosphor-leptos = "0.8"

# WASM error handling (client-only, but always compiled — no-op on server)
console_error_panic_hook = "0.1"

# Browser DOM access (for theme toggling, clipboard, etc.)
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlElement", "HtmlTextAreaElement", "HtmlInputElement",
    "Element", "EventTarget", "Node",
    "KeyboardEvent", "DomTokenList", "MediaQueryList", "Location",
    "ScrollIntoViewOptions", "ScrollBehavior", "CssStyleDeclaration",
    "RequestCredentials", "RequestInit", "Headers",
    "Navigator", "Clipboard", "Storage", "ServiceWorkerContainer",
    # WebSocket support (dashboard live updates)
    "WebSocket", "MessageEvent", "CloseEvent",
    # WebAuthn / passkey support
    "CredentialsContainer", "Credential", "PublicKeyCredential",
    "AuthenticatorResponse", "AuthenticatorAttestationResponse",
    "AuthenticatorAssertionResponse",
    "CredentialCreationOptions", "CredentialRequestOptions",
    # PDF export (fetch → blob → download)
    "Response", "Blob", "Url", "CustomEvent", "CustomEventInit",
    # Panic overlay: raw fetch request for bug reports
    "Request",
    # IntersectionObserver (infinite scroll in query history)
    "IntersectionObserver", "IntersectionObserverInit", "IntersectionObserverEntry",
    # ResizeObserver (chart header narrow-tier detection — see chart_header_bar.rs)
    "ResizeObserver", "ResizeObserverEntry", "DomRectReadOnly",
    # SQL Editor: crypto.randomUUID() and performance.now()
    "Crypto", "Performance",
    # Feedback modal: screenshot capture + file upload
    "MediaDevices", "MediaStream", "MediaStreamTrack",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
    "FileReader", "File", "FileList",
    "HtmlVideoElement", "MediaStreamConstraints",
] }

# SendWrapper for non-Send JS values in Leptos reactive closures
send_wrapper = "0.6"

# WASM interop (session refresh via JS fetch)
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Base64 encoding (for Cursor deep-link config)
base64 = { workspace = true }

# Async timers for WASM (copy feedback reset)
gloo-timers = { version = "0.3", features = ["futures"] }

# Logging
tracing = { workspace = true }

# Internal crates (server-only — gated behind ssr feature)
kyomi-core = { workspace = true, optional = true }
kyomi-auth = { workspace = true, optional = true }
kyomi-agent = { workspace = true, optional = true }
kyomi-datasource-server = { workspace = true, optional = true }
kyomi-connect-protocol = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
webauthn-rs = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

# Knowledge graph + embedding (server-only — gated behind ssr feature)
kyomi-embed = { workspace = true, optional = true }
kyomi-knowledge = { workspace = true, optional = true }

# ChartML (Arrow-backed data tables for chart rendering)
chartml-core = { workspace = true }
chartml-leptos = { workspace = true }
chartml-chart-cartesian = { workspace = true }
chartml-chart-pie = { workspace = true }
chartml-chart-scatter = { workspace = true }
chartml-chart-metric = { workspace = true }
chartml-chart-table = { workspace = true }
chartml-datafusion = { workspace = true }
# Shared chart palettes + editorial theme — wasm-compatible, no server deps.
kyomi-chart-theme = { workspace = true }
async-trait = { workspace = true }

# Markdown rendering (shared — works in both SSR and WASM)
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Code editor (WASM-only — uses web-sys DOM APIs)
kode-leptos = { workspace = true }
# Tree-sitter grammars for kode-leptos. Features selected in the workspace
# Cargo.toml keep only the grammars this app actually uses (sql, yaml,
# markdown) — cutting ~12 other language tables saves multiple MB of WASM.
arborium = { workspace = true }

# libm: software-implemented math functions for wasm32-unknown-unknown.
# DataFusion's default math UDFs (acosh/asinh/atanh) emit extern C calls that
# the wasm32 target's stdlib can't resolve. See src/wasm_math_shims.rs.

# ChartML parser (YAML parsing + block extraction)
serde_yaml = { workspace = true }
regex = { workspace = true }
similar = { workspace = true }

# Date/time (used in both SSR and WASM for date formatting)
chrono = { workspace = true }

# HMAC (for trial chat token generation/validation — server-only)
hmac = { workspace = true, optional = true }

# Arrow (for converting query results to IPC bytes — server-only)
arrow-schema = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }

# Futures (for StreamExt in streaming query server functions — server-only)
futures-util = { workspace = true, optional = true }

# Enterprise crates (optional, behind feature flags)
kyomi-slack = { path = "../../enterprise/kyomi-slack", optional = true }

# Pure-Rust libm for wasm32: provides soft impls of acosh/asinh/atanh that
# `wasm32-unknown-unknown`'s stdlib lowers to extern C calls. See wasm_math_shims.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
libm = "0.2"

# Client-side persistent cache for the sync engine (WASM-only).
#
# Design: rusqlite + sqlite-wasm-vfs was evaluated but dropped because rusqlite
# carries `links = "sqlite3"` which conflicts with sqlx's sqlite feature at the
# workspace resolver level (Cargo checks link conflicts across all platforms).
# Instead we use `indexed_db_futures` directly — it provides the same persistent
# key-value semantics via IndexedDB with a clean async Rust API and no link
# conflicts.
indexed_db_futures = { version = "0.6", features = ["serde"] }

[dev-dependencies]
kyomi-core = { workspace = true, features = ["test-helpers"] }
kyomi-auth = { workspace = true }
tokio = { workspace = true }
# P-256 key generation for Connect token unit tests — matches what
# kyomi-auth::connect_token::tests uses to build an ephemeral signing key.
p256 = { workspace = true }
