[package]
name = "kyomi-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
sqlx = { workspace = true }
pgvector = { workspace = true }
redis = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
kyomi-connect-protocol = { workspace = true }
kyomi-types = { workspace = true }
dashmap = { workspace = true }
tokio-util = { workspace = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
test-helpers = ["dep:sha2", "dep:hex"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
sha2 = { workspace = true }
hex = { workspace = true }
# Self dev-dependency: activates our own `test-helpers` feature so this
# crate's own integration tests (crates/kyomi-core/tests/*.rs) can call
# `kyomi_core::test_db`, which is gated `cfg(any(test, feature =
# "test-helpers"))`. `cfg(test)` alone does NOT cover integration test
# binaries — they link against the crate compiled without `--cfg test`.
kyomi-core = { path = ".", features = ["test-helpers"] }

[lints]
workspace = true
