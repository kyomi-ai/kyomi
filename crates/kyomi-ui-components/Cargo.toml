[package]
name = "kyomi-ui-components"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
leptos = "0.8"
phosphor-leptos = "0.8"

send_wrapper = "0.6"
js-sys = "0.3"
wasm-bindgen = "0.2"

web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "Element",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "MediaQueryList",
    "Storage",
    "CssStyleDeclaration",
    "ResizeObserver",
    "ResizeObserverEntry",
    "DomRectReadOnly",
] }
