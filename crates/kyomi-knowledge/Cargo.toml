[package]
name = "kyomi-knowledge"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
kyomi-core = { workspace = true }
kyomi-embed = { workspace = true }
sqlx = { workspace = true }
pgvector = { workspace = true }
sqlparser = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# Enables kyomi-core's "test-helpers" feature (gating `kyomi_core::test_db`)
# for this crate's own test target only — kyomi-core is already a normal
# dependency above without that feature. Same pattern as
# crates/kyomi-auth/Cargo.toml and apps/server/Cargo.toml; see
# crates/kyomi-core/src/test_db.rs's module docs. KYO-292.
kyomi-core = { workspace = true, features = ["test-helpers"] }

[lints]
workspace = true
