[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Application-independent durable conversation protocol and atomic append policy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
