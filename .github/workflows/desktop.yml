# =============================================================================
# Kyomi — Desktop Build
# =============================================================================
# Builds Tauri desktop installers for all platforms.
# Triggered on version tags alongside the release workflow.
#
# Artifacts are attached to the same GitHub Release created by release.yml.
# =============================================================================

name: Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: 0.21.14
  WASM_BINDGEN_VERSION: 0.2.114
  TAILWIND_VERSION: v4.2.2
  BINARYEN_VERSION: version_123

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            trunk_arch: x86_64
            trunk_os_suffix: unknown-linux-gnu
            wasm_bindgen_arch: x86_64-unknown-linux-musl
            tailwind_binary: tailwindcss-linux-x64
            binaryen_arch: x86_64-linux
            bundles: deb appimage
            sed_inplace: "sed -i"
          - os: macos
            runner: macos-latest
            trunk_arch: aarch64
            trunk_os_suffix: apple-darwin
            wasm_bindgen_arch: aarch64-apple-darwin
            tailwind_binary: tailwindcss-macos-arm64
            binaryen_arch: arm64-macos
            bundles: dmg
            sed_inplace: "sed -i ''"
          - os: windows
            runner: windows-latest
            bundles: msi nsis
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: Verify sccache is usable
        if: matrix.os != 'windows'
        run: |
          if sccache --show-stats >/dev/null 2>&1; then
            echo "SCCACHE_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "::warning::sccache GHA cache unavailable, building without cache"
            echo "SCCACHE_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Verify sccache is usable (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          sccache --start-server 2>$null
          sccache --show-stats 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            echo "SCCACHE_AVAILABLE=true" >> $env:GITHUB_ENV
          } else {
            echo "::warning::sccache GHA cache unavailable, building without cache"
            echo "SCCACHE_AVAILABLE=false" >> $env:GITHUB_ENV
          }

      # --- Linux/macOS build tools ---
      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev clang \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install brotli llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Set wasm32 C compiler (macOS)
        if: matrix.os == 'macos'
        run: |
          echo "CC_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV

      - name: Strip local-dev blocks (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          ${{ matrix.sed_inplace }} '/# BEGIN_LOCAL_DEV_PATCHES/,/# END_LOCAL_DEV_PATCHES/d' Cargo.toml
          ${{ matrix.sed_inplace }} '/# BEGIN_LOCAL_DEV_PATCHES/,/# END_LOCAL_DEV_PATCHES/d' apps/mcp-chart-app-wasm/Cargo.toml
          ${{ matrix.sed_inplace }} '/# BEGIN_LOCAL_DEV_LINKER/,/# END_LOCAL_DEV_LINKER/d' .cargo/config.toml
          ${{ matrix.sed_inplace }} '/cargo_profile/d' crates/kyomi-ui/Trunk.toml

      - name: Strip local-dev blocks (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          (Get-Content -Raw Cargo.toml) -replace '(?s)# BEGIN_LOCAL_DEV_PATCHES.*?# END_LOCAL_DEV_PATCHES\r?\n?', '' | Set-Content Cargo.toml -NoNewline
          (Get-Content -Raw apps/mcp-chart-app-wasm/Cargo.toml) -replace '(?s)# BEGIN_LOCAL_DEV_PATCHES.*?# END_LOCAL_DEV_PATCHES\r?\n?', '' | Set-Content apps/mcp-chart-app-wasm/Cargo.toml -NoNewline
          (Get-Content -Raw .cargo/config.toml) -replace '(?s)# BEGIN_LOCAL_DEV_LINKER.*?# END_LOCAL_DEV_LINKER\r?\n?', '' | Set-Content .cargo/config.toml -NoNewline
          (Get-Content crates/kyomi-ui/Trunk.toml) | Where-Object { $_ -notmatch 'cargo_profile' } | Set-Content crates/kyomi-ui/Trunk.toml

      - name: Install trunk + wasm-bindgen-cli + tailwindcss + wasm-opt (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "linux" ]; then
            SUDO=sudo
          else
            SUDO=""
          fi
          $SUDO curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-${{ matrix.trunk_arch }}-${{ matrix.trunk_os_suffix }}.tar.gz" \
            | $SUDO tar -xz -C /usr/local/bin trunk
          $SUDO curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-${{ matrix.wasm_bindgen_arch }}.tar.gz" \
            | $SUDO tar -xz --strip-components=1 -C /usr/local/bin \
                "wasm-bindgen-${WASM_BINDGEN_VERSION}-${{ matrix.wasm_bindgen_arch }}/wasm-bindgen"
          $SUDO curl -fsSL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/${{ matrix.tailwind_binary }}"
          $SUDO chmod +x /usr/local/bin/tailwindcss
          if [ "${{ matrix.os }}" = "linux" ]; then
            sudo apt-get install -y --no-install-recommends brotli
          fi
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-${{ matrix.binaryen_arch }}.tar.gz" \
            | tar -xz -C /tmp
          mkdir -p "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin"
          mv "/tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" \
            "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt-real"
          printf '#!/bin/sh\nexec "%s" --enable-bulk-memory-opt --enable-nontrapping-float-to-int "$@"\n' \
            "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt-real" \
            > "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt"
          chmod +x "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt"

      - name: Install trunk + wasm-bindgen-cli + tailwindcss + wasm-opt (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cargo install trunk --version "^$env:TRUNK_VERSION" --locked
          cargo install wasm-bindgen-cli --version "=$env:WASM_BINDGEN_VERSION" --locked
          Invoke-WebRequest -Uri "https://github.com/tailwindlabs/tailwindcss/releases/download/$env:TAILWIND_VERSION/tailwindcss-windows-x64.exe" -OutFile "$env:CARGO_HOME\bin\tailwindcss.exe"
          $binaryenUrl = "https://github.com/WebAssembly/binaryen/releases/download/$env:BINARYEN_VERSION/binaryen-$env:BINARYEN_VERSION-x86_64-windows.tar.gz"
          Invoke-WebRequest -Uri $binaryenUrl -OutFile binaryen.tar.gz
          tar -xzf binaryen.tar.gz -C $env:TEMP
          $wasmOptDir = "$env:USERPROFILE\.cache\trunk\wasm-opt-$env:BINARYEN_VERSION\bin"
          New-Item -ItemType Directory -Force -Path $wasmOptDir | Out-Null
          Move-Item "$env:TEMP\binaryen-$env:BINARYEN_VERSION\bin\wasm-opt.exe" "$wasmOptDir\wasm-opt.exe"

      - name: Build Leptos WASM frontend
        working-directory: crates/kyomi-ui
        run: trunk build --release

      - name: Build MCP chart app WASM (Linux/macOS)
        if: matrix.os != 'windows'
        working-directory: apps/mcp-chart-app-wasm
        run: bash build.sh

      - name: Build MCP chart app WASM (Windows)
        if: matrix.os == 'windows'
        working-directory: apps/mcp-chart-app-wasm
        shell: pwsh
        run: |
          trunk build --release
          Copy-Item dist/index.html chart_app.html

      - name: Bundle with cargo-tauri
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: apps/desktop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Upload artifacts to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
