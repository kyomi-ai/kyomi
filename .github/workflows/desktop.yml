# =============================================================================
# Kyomi — Desktop Build (KYO-113)
# =============================================================================
# Builds Tauri desktop installers for Linux (.deb, .AppImage).
# Triggered on version tags alongside the release workflow.
#
# Uses the kyomi-desktop runner scale set (Ubuntu 22.04 + Tauri deps
# pre-installed). macOS and Windows builds require native runners and
# are tracked separately.
# =============================================================================

name: Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: 0.21.14
  WASM_BINDGEN_VERSION: 0.2.114
  TAILWIND_VERSION: v4.2.2
  BINARYEN_VERSION: version_123

jobs:
  linux:
    name: Linux Desktop (.deb + .AppImage)
    runs-on: kyomi-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Strip local-dev patch.crates-io block
        run: sed -i '/# BEGIN_LOCAL_DEV_PATCHES/,/# END_LOCAL_DEV_PATCHES/d' Cargo.toml

      - name: Strip local-dev mold linker config
        run: sed -i '/# BEGIN_LOCAL_DEV_LINKER/,/# END_LOCAL_DEV_LINKER/d' .cargo/config.toml

      - name: Install trunk + wasm-bindgen-cli + tailwindcss + wasm-opt
        run: |
          set -euo pipefail
          sudo curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trunk
          sudo curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin \
                "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
          sudo curl -fsSL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          sudo chmod +x /usr/local/bin/tailwindcss
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C /tmp
          mkdir -p "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin"
          mv "/tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" \
            "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt-real"
          printf '#!/bin/sh\nexec "%s" --enable-bulk-memory-opt --enable-nontrapping-float-to-int "$@"\n' \
            "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt-real" \
            > "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt"
          chmod +x "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt"

      - name: Build Leptos WASM frontend
        working-directory: crates/kyomi-ui
        run: trunk build --release

      - name: Build MCP chart app WASM
        working-directory: apps/mcp-chart-app-wasm
        run: bash build.sh

      - name: Bundle with cargo-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles deb appimage
        working-directory: apps/desktop

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
