# =============================================================================
# Kyomi — Desktop Build
# =============================================================================
# Builds Tauri desktop installers for linux, macos and windows.
#
# STATUS: active. The desktop app still ships; installers are built on demand
# when a desktop release is cut, not on every version tag.
#
# TRIGGER: workflow_dispatch only, and that is deliberate — not an oversight
# and not a stale comment. `82c00a03` ("chore: disable desktop builds on tag
# push (manual dispatch only) (#31)", 2026-05-08) removed the tag trigger the
# day after the matrix went green. Re-adding it would reverse a recorded
# decision; do not "fix" this without asking (KYO-320).
#
# Artifacts are attached to the same GitHub Release created by release.yml.
# The upload step is guarded by `if: github.ref_type == 'tag'`, so dispatching
# this workflow on a branch builds and verifies but publishes nothing — that is
# the cheap way to check the matrix still compiles.
#
# WINDOWS LEG: green, and expected to stay that way. A reading of the run
# history is misleading here, so it is recorded once: the last 8 runs before
# 2026-05-08 show windows at 1 success / 7 failures, which looks like a
# chronically broken leg. It is not. Those seven failures are the consecutive
# debugging commits that fixed it, one per attempt, ending at `da764cb5`
# ("fix: disable sccache on Windows desktop build (linker exit code 2)
# (#30)"). Run 25530975421 was green on all three legs.
#
# Re-verified 2026-08-10 on `72343862` via run 31437801869: linux, macos and
# windows all green, three months and a large amount of workspace churn after
# that fix. If you are here because the 1-in-8 statistic looked alarming, it
# was measuring a debugging session (KYO-320).
# =============================================================================

name: Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: 0.21.14
  WASM_BINDGEN_VERSION: 0.2.121
  TAILWIND_VERSION: v4.2.2
  BINARYEN_VERSION: version_128

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Observed execution max: 61.9m (last ~15 runs). 120m leaves
          # ~58m of headroom, which also covers runner-acquisition queue
          # delay — timeout-minutes counts queued time, not just
          # execution time (KYO-259, KYO-322).
          - os: linux
            runner: ubuntu-latest
            trunk_arch: x86_64
            trunk_os_suffix: unknown-linux-gnu
            wasm_bindgen_arch: x86_64-unknown-linux-musl
            tailwind_binary: tailwindcss-linux-x64
            binaryen_arch: x86_64-linux
            bundles: deb appimage
            sed_inplace: "sed -i"
            timeout: 120
          # Observed execution max: 224.1m (last ~15 runs) — macOS desktop
          # builds legitimately take 2-4 hours; do not lower this to match
          # the other legs (KYO-259). That figure is execution time only;
          # the 300m timeout below also has to absorb runner-acquisition
          # queue delay, since timeout-minutes counts queued time too
          # (KYO-322).
          #
          # 300 is deliberately the ceiling rather than something roomier:
          # GitHub's own default job timeout is 360, so anything at or above
          # that is indistinguishable from setting no timeout at all. This
          # leg has the thinnest margin of the three (~34% over observed max,
          # on only 5 samples spanning 125-224m) — that is the cost of the
          # 360 cap, not an oversight. If a healthy build ever gets killed
          # here, the fix is to make the build faster, not to raise this to
          # 360 and silently give up the bound.
          - os: macos
            runner: macos-latest
            trunk_arch: aarch64
            trunk_os_suffix: apple-darwin
            wasm_bindgen_arch: aarch64-apple-darwin
            tailwind_binary: tailwindcss-macos-arm64
            binaryen_arch: arm64-macos
            bundles: dmg
            sed_inplace: "sed -i ''"
            timeout: 300
          # Observed execution max: 99.7m (last ~15 runs). 180m leaves
          # ~80m of headroom, which also covers runner-acquisition queue
          # delay — timeout-minutes counts queued time, not just
          # execution time (KYO-259, KYO-322).
          - os: windows
            runner: windows-latest
            bundles: msi nsis
            timeout: 180
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach GHA cache
        if: matrix.os != 'windows'
        run: |
          echo 'fn main(){}' > /tmp/sccache_test.rs
          if sccache $(rustc --print sysroot)/bin/rustc /tmp/sccache_test.rs --crate-type bin -o /tmp/sccache_test_out; then
            echo "SCCACHE_AVAILABLE=true" >> $GITHUB_ENV
            sccache --show-stats 2>&1 | head -5
          else
            echo "::warning::sccache GHA cache probe failed (see above), building without cache"
            echo "SCCACHE_AVAILABLE=false" >> $GITHUB_ENV
          fi
          rm -f /tmp/sccache_test.rs /tmp/sccache_test_out

      - name: Skip sccache on Windows (linker compatibility)
        if: matrix.os == 'windows'
        shell: pwsh
        run: echo "SCCACHE_AVAILABLE=false" >> $env:GITHUB_ENV

      # --- Linux/macOS build tools ---
      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev clang \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install brotli llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Set wasm32 C compiler (macOS)
        if: matrix.os == 'macos'
        run: |
          echo "CC_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV

      - name: Strip local-dev linker and trunk profile (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          ${{ matrix.sed_inplace }} '/# BEGIN_LOCAL_DEV_LINKER/,/# END_LOCAL_DEV_LINKER/d' .cargo/config.toml
          ${{ matrix.sed_inplace }} '/cargo_profile/d' crates/kyomi-ui/Trunk.toml

      - name: Strip local-dev linker and trunk profile (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          (Get-Content -Raw .cargo/config.toml) -replace '(?s)# BEGIN_LOCAL_DEV_LINKER.*?# END_LOCAL_DEV_LINKER\r?\n?', '' | Set-Content .cargo/config.toml -NoNewline
          (Get-Content crates/kyomi-ui/Trunk.toml) | Where-Object { $_ -notmatch 'cargo_profile' } | Set-Content crates/kyomi-ui/Trunk.toml

      - name: Install trunk + wasm-bindgen-cli + tailwindcss + wasm-opt (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "linux" ]; then
            SUDO=sudo
          else
            SUDO=""
          fi
          $SUDO curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-${{ matrix.trunk_arch }}-${{ matrix.trunk_os_suffix }}.tar.gz" \
            | $SUDO tar -xz -C /usr/local/bin trunk
          $SUDO curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-${{ matrix.wasm_bindgen_arch }}.tar.gz" \
            | $SUDO tar -xz --strip-components=1 -C /usr/local/bin \
                "wasm-bindgen-${WASM_BINDGEN_VERSION}-${{ matrix.wasm_bindgen_arch }}/wasm-bindgen"
          $SUDO curl -fsSL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/${{ matrix.tailwind_binary }}"
          $SUDO chmod +x /usr/local/bin/tailwindcss
          if [ "${{ matrix.os }}" = "linux" ]; then
            sudo apt-get install -y --no-install-recommends brotli
          fi
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-${{ matrix.binaryen_arch }}.tar.gz" \
            | tar -xz -C /tmp
          sudo mv "/tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt
          if [ -f "/tmp/binaryen-${BINARYEN_VERSION}/lib/libbinaryen.dylib" ]; then
            sudo mkdir -p /usr/local/lib
            sudo cp "/tmp/binaryen-${BINARYEN_VERSION}/lib/libbinaryen.dylib" /usr/local/lib/
          fi

      - name: Install trunk + wasm-bindgen-cli + tailwindcss + wasm-opt (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cargo install trunk --version "^$env:TRUNK_VERSION" --locked
          cargo install wasm-bindgen-cli --version "=$env:WASM_BINDGEN_VERSION" --locked
          Invoke-WebRequest -Uri "https://github.com/tailwindlabs/tailwindcss/releases/download/$env:TAILWIND_VERSION/tailwindcss-windows-x64.exe" -OutFile "$env:CARGO_HOME\bin\tailwindcss.exe"
          $binaryenUrl = "https://github.com/WebAssembly/binaryen/releases/download/$env:BINARYEN_VERSION/binaryen-$env:BINARYEN_VERSION-x86_64-windows.tar.gz"
          Invoke-WebRequest -Uri $binaryenUrl -OutFile binaryen.tar.gz
          tar -xzf binaryen.tar.gz -C $env:TEMP
          Move-Item "$env:TEMP\binaryen-$env:BINARYEN_VERSION\bin\wasm-opt.exe" "$env:CARGO_HOME\bin\wasm-opt.exe"

      - name: Build Leptos WASM frontend (trunk, wasm-opt disabled)
        working-directory: crates/kyomi-ui
        run: trunk build --release

      - name: Optimize WASM with wasm-opt (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          for f in crates/kyomi-ui/dist/*_bg.wasm; do
            wasm-opt --enable-bulk-memory-opt --enable-nontrapping-float-to-int -O -o "${f}.opt" "$f"
            mv "${f}.opt" "$f"
          done

      - name: Optimize WASM with wasm-opt (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem crates/kyomi-ui/dist/*_bg.wasm | ForEach-Object {
            wasm-opt --enable-bulk-memory-opt --enable-nontrapping-float-to-int -O -o "$($_.FullName).opt" $_.FullName
            Move-Item -Force "$($_.FullName).opt" $_.FullName
          }

      - name: Build MCP chart app WASM (Linux/macOS)
        if: matrix.os != 'windows'
        working-directory: apps/mcp-chart-app-wasm
        run: bash build.sh

      - name: Build MCP chart app WASM (Windows)
        if: matrix.os == 'windows'
        working-directory: apps/mcp-chart-app-wasm
        shell: pwsh
        run: |
          trunk build --release
          Copy-Item dist/index.html chart_app.html

      - name: Bundle with cargo-tauri
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.os == 'windows' && 'false' || 'true' }}
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: apps/desktop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Upload artifacts to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
