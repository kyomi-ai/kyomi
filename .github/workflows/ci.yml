# =============================================================================
# Kyomi — CI (Pull Request Checks)
# =============================================================================
# Runs on every PR to main, including new pushes to existing PRs.
# Seven jobs:
#   1. lint-policy (fast, ~5s) — rejects new #[allow(...)] suppressions,
#      runs the server_fn/REST divergence linter across the full tree, and
#      (KYO-662) blocks real-world identifiers in tracked files and the
#      PR's own commit messages
#   2. trivy-scan (~30s) — Trivy filesystem vulnerability scanner (HIGH/CRITICAL)
#   3. cargo-audit (fast, ~15s) — RUSTSEC advisories against Cargo.lock
#   4. schema-parity (fast — only compiles kyomi-core, not the workspace) —
#      diffs the Postgres and SQLite migration chains' resulting schemas;
#      needs its own postgres service (KYO-206)
#   5. clippy (slow) — full workspace clippy + compilation check + unit
#      tests, integration tests, and doctests (apps/server/tests/ — needs
#      the postgres service below; KYO-236)
#   6. ssr-contract-tests (slow, runs parallel to clippy — see the job's own
#      comment for why it's a separate job rather than a step tacked onto
#      clippy) — real trunk build of crates/kyomi-ui, then the SSR contract
#      suite against it (KYO-255)
#   7. worktree-lifecycle-selftests (fast, ~5s, no toolchain) — runs the
#      self-test suites for the shell scripts that gate ticket claiming,
#      stranded-worktree/branch recovery, and merged-PR-to-ticket
#      reconciliation (KYO-578, KYO-617), plus (KYO-629) the
#      preflight-clippy.sh/ci.yml flag-parity suite and (KYO-632) the
#      self-test for the stale-tooling-guard those scripts source — the
#      job hosts more than worktree-lifecycle scripts now, see its own
#      header comment
#
# A note on `timeout-minutes` (KYO-322): GitHub starts that clock when a
# job is QUEUED, not when a runner picks it up, so a job that executes in
# seconds can still be killed by its timeout if it waits long enough for
# a runner to become available — job 92674541505 (Migration Schema
# Parity, 15m timeout) was cancelled at exactly 15m01s with zero steps
# run, entirely queue time. Every `timeout-minutes` value below is
# therefore observed execution max *plus* deliberate headroom for that
# runner-acquisition wait, not a multiple of execution time alone
# (KYO-259 set the first pass off execution time only; KYO-322 corrected
# the basis and re-checked every value against it — most were raised, the
# already-roomy ones were verified sufficient and left unchanged). The
# execution-time notes above (e.g. "fast, ~5s") describe how long each
# job actually runs once a runner has it — they remain accurate and are
# not the timeout basis.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Fast check: reject new lint suppressions (no Rust toolchain needed)
  # ---------------------------------------------------------------------------
  lint-policy:
    name: Lint Suppression Policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject new lint suppressions
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          # Check .rs files for #[allow(...)]
          RS=$(git diff "$BASE"...HEAD -- '*.rs' | grep '^+' | grep -v '^+++' | grep '#\[allow(' || true)
          # Check Cargo.toml for = "allow" lint downgrades
          TOML=$(git diff "$BASE"...HEAD -- '*/Cargo.toml' 'Cargo.toml' | grep '^+' | grep -v '^+++' | grep '= "allow"' || true)
          if [ -n "$RS" ] || [ -n "$TOML" ]; then
            echo "::error::Lint suppressions detected. Fix the lint instead of suppressing it."
            [ -n "$RS" ] && echo "" && echo "In .rs files:" && echo "$RS"
            [ -n "$TOML" ] && echo "" && echo "In Cargo.toml:" && echo "$TOML"
            exit 1
          fi
          echo "✅ No new lint suppressions."

      # --------------------------------------------------------------------
      # Server function / REST divergence lint (KYO-122).
      #
      # Blocks two patterns that caused the KYO-70, KYO-72, KYO-115
      # outages:
      #   A) server_fns pulling non-allowlisted DI via use_context::<T>()
      #   B) server_fns doing heavy service-layer orchestration that
      #      diverges from the REST handler
      #
      # Pure bash + awk, no Rust toolchain required (~200ms).
      # --------------------------------------------------------------------
      - name: Server function / REST divergence lint
        run: ./scripts/lint/check-server-fns.sh

      # --------------------------------------------------------------------
      # Signal disposal safety lint (introduced by PR #34).
      #
      # Rule A blocks bare .set()/.update() inside spawn_local/deferred
      # contexts (must use .try_set()/.try_update() to avoid WASM panics
      # when signals are disposed during page navigation). Rule B (KYO-679)
      # blocks bare .get() inside Signal::derive/Memo::new that is NOT
      # already recorded in scripts/lint/disposal-safety-baseline.txt (or
      # exceeds its recorded occurrence count) — a ratchet over the 388
      # pre-existing advisory sites, not a full gate on all of them; see
      # the script's own header NOTE. This full-tree run is also the one
      # that enforces the baseline may only shrink (a stale entry here is
      # a failure naming --update-baseline) — the pre-commit hook's
      # file-scoped runs deliberately do not enforce that half.
      #
      # Pure bash + awk (+ a single batched `perl -MDigest::SHA` process for
      # Rule B's baseline hashing), no Rust toolchain required (~200ms).
      # --------------------------------------------------------------------
      - name: Signal disposal safety lint
        run: ./scripts/lint/check-disposal-safety.sh

      # --------------------------------------------------------------------
      # Real-world identifier lint (KYO-662).
      #
      # A customer's real GCP project id and a real service-account
      # identity reached this public repo's main across four merged PRs and
      # needed a history rewrite. This is the gate: five blocking rules
      # (GCP service-account addresses, non-allowlisted email domains,
      # public IPv4 addresses, credential-shaped tokens, and a
      # salted-hash-matched denylist for identifiers with no distinguishing
      # shape at all) run over every tracked file here, and separately over
      # this PR's own commit messages below. This is the gate that actually
      # matters — core.hooksPath is per-clone and cannot be committed, so an
      # agent or contributor working in a fresh worktree may have no git
      # hooks installed at all.
      #
      # Pure bash + a single embedded Perl pass, no Rust toolchain required.
      # --------------------------------------------------------------------
      - name: Real-identifier lint (full tree)
        run: ./scripts/lint/check-real-identifiers.sh

      - name: Real-identifier lint (commit messages)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          ./scripts/lint/check-real-identifiers.sh --messages "$BASE..HEAD"

      # --------------------------------------------------------------------
      # Git hooks guard (KYO-358).
      #
      # `.githooks/pre-commit` and `.githooks/pre-push` are only enforced
      # locally if a contributor's clone has `core.hooksPath` pointed at
      # `.githooks` AND the hook files are executable — git silently skips
      # a hook it can't exec, so a hook that regresses to mode 100644 (e.g.
      # re-added via a tool that doesn't preserve the bit) fails open with
      # no signal anywhere. This step catches that class of regression in
      # CI, independent of any single contributor's local setup:
      #   - .githooks/ exists and has at least one hook file
      #   - every tracked file in .githooks/ is mode 100755 (checked via
      #     `git ls-files -s`, the mode a fresh clone actually gets — not
      #     the filesystem bit on the runner's checkout)
      #   - every hook parses (`bash -n`), so a hook can't rot into
      #     something that fails to run at all
      #
      # Pure bash, no Rust toolchain required.
      # --------------------------------------------------------------------
      - name: Git hooks guard
        run: |
          if [ ! -d .githooks ] || [ -z "$(ls -A .githooks)" ]; then
            echo "::error::.githooks/ is missing or empty."
            exit 1
          fi

          status=0
          while read -r mode _ _ path; do
            if [ "$mode" != "100755" ]; then
              echo "::error::${path} is tracked as mode ${mode}, expected 100755 (chmod +x it and re-stage)."
              status=1
            fi
            if ! bash -n "$path"; then
              echo "::error::${path} failed bash -n syntax check."
              status=1
            fi
          done <<< "$(git ls-files -s .githooks/)"

          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "✅ .githooks/ hooks are executable and syntactically valid."

  # ---------------------------------------------------------------------------
  # Security: Trivy filesystem vulnerability scan
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

  # ---------------------------------------------------------------------------
  # Security: RUSTSEC advisory audit of Cargo.lock
  #
  # Trivy (above) scans the filesystem but does not surface RUSTSEC advisories
  # for the Rust dependency graph — eleven of them accumulated undetected
  # before this job existed. cargo-audit reads Cargo.lock directly,
  # so it needs no toolchain and no compilation (~15s).
  #
  # Known-unfixable advisories are ignored via .cargo/audit.toml, where each
  # one carries a justification and the upstream condition for removing it.
  # Do NOT add an ignore there to make this job green — take the fix.
  #
  # Advisory database: deliberately NOT pinned (KYO-785, decided 2026-09-24).
  # This job fails only on a real vulnerability — unmaintained/unsound/yanked
  # are informational via .cargo/audit.toml. A red run that no commit here
  # caused therefore means a new disclosure against something we ship, which
  # is the one signal this job exists to surface early. Pinning the DB would
  # hide that until someone chose to refresh it. The one red run to date
  # (2026-09-14, KYO-785) was RUSTSEC-2026-0285, a real rustls TLS bug,
  # cleared by taking the fix (#538) — exactly the asymmetry that makes this
  # different from pinning the toolchain (KYO-402): a new lint on a new
  # toolchain says nothing about the shipped artefact, a new advisory does.
  # This job is not a required status check (as of 2026-09-24), so a red run
  # leaves PRs mergeable (UNSTABLE) rather than blocked — the cost of staying
  # unpinned is a visible red, not a merge outage. When it does go red: take
  # the fix, or add a justified, dated ignore to .cargo/audit.toml — never
  # pin the DB or skip the job to force green.
  # ---------------------------------------------------------------------------
  cargo-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Migration schema-parity check (KYO-206)
  #
  # Kyomi maintains two parallel migration chains — apps/server/migrations
  # (Postgres/SaaS) and apps/server/migrations-sqlite (SQLite/self-hosted) —
  # and nothing else enforces that they converge on the same logical schema.
  # Two divergences of exactly this shape already shipped to production
  # undetected (KYO-200): collections.doc_type and thinking_event_details
  # existed only on Postgres, breaking self-hosted SQLite deployments.
  #
  # crates/kyomi-core/tests/schema_parity.rs runs the real embedded
  # sqlx::migrate! chains from crates/kyomi-core/src/db.rs against a scratch
  # Postgres database and a fresh in-memory SQLite database, introspects
  # both resulting schemas, and fails on any divergence not covered by
  # apps/server/schema-parity-allowlist.toml.
  #
  # This is its own job (not folded into `clippy` below) so a schema
  # divergence surfaces in ~1 minute instead of being gated behind a
  # ~35-minute full-workspace clippy run. It only compiles kyomi-core (not
  # the workspace), so it stays fast even without that separation.
  #
  # Same postgres service shape as the `clippy` job below (KYO-236) — same
  # credentials/db name as kyomi-core's Config::test_config() default, so no
  # DATABASE_URL override is needed. This is a *separate* container from
  # clippy's: each job gets its own fresh service. The check additionally
  # creates and drops its own scratch database inside that container rather
  # than touching the `kyomi_test` database directly, so it stays hermetic
  # even if a future change makes these jobs share infrastructure (KYO-242).
  # ---------------------------------------------------------------------------
  schema-parity:
    name: Migration Schema Parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: kyomi_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kyomi_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kyomi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach GHA cache
        run: |
          echo 'fn main(){}' > /tmp/sccache_test.rs
          if sccache $(rustc --print sysroot)/bin/rustc /tmp/sccache_test.rs --crate-type bin -o /tmp/sccache_test_out; then
            echo "SCCACHE_AVAILABLE=true" >> $GITHUB_ENV
            sccache --show-stats 2>&1 | head -5
          else
            echo "::warning::sccache GHA cache probe failed (see above), building without cache"
            echo "SCCACHE_AVAILABLE=false" >> $GITHUB_ENV
          fi
          rm -f /tmp/sccache_test.rs /tmp/sccache_test_out

      # .cargo/config.toml sets `-C link-arg=-fuse-ld=mold` for local dev
      # between these markers. mold isn't installed on the runner, so clang
      # fails with "invalid linker name" on the first build-script link if
      # this isn't stripped. The `clippy` job below does the same — keep
      # them in step.
      - name: Strip local-dev mold linker config
        run: sed -i '/# BEGIN_LOCAL_DEV_LINKER/,/# END_LOCAL_DEV_LINKER/d' .cargo/config.toml

      - name: cargo test (schema parity)
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo test --locked -p kyomi-core --test schema_parity -- --nocapture

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # ---------------------------------------------------------------------------
  # Slow check: cargo clippy (compiles + lints the entire workspace)
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # Observed execution max: 40.9m (last ~15 runs). 75m adds headroom for
    # the slowest legitimate compile plus runner-acquisition queue time,
    # which counts against timeout-minutes too (KYO-259, KYO-322).
    timeout-minutes: 75
    env:
      SCCACHE_GHA_ENABLED: "true"
    # postgres backs the apps/server/tests/ contract-test suite (KYO-236).
    # Credentials/db name match kyomi-core's Config::test_config() default
    # so the cargo test step below needs no DATABASE_URL override. Redis is
    # NOT needed here — kv_store::create_kv_store() falls back to an
    # in-memory KV store when REDIS_URL is unset. The one test that talks to
    # Redis directly (scheduler_redis_lock_acquire_and_release) is disabled
    # via #[ignore] pending KYO-252 — it does not skip gracefully without
    # Redis, it hangs 5-6 minutes before reaching its own error branch.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: kyomi_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kyomi_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kyomi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev clang poppler-utils

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach GHA cache
        run: |
          echo 'fn main(){}' > /tmp/sccache_test.rs
          if sccache $(rustc --print sysroot)/bin/rustc /tmp/sccache_test.rs --crate-type bin -o /tmp/sccache_test_out; then
            echo "SCCACHE_AVAILABLE=true" >> $GITHUB_ENV
            sccache --show-stats 2>&1 | head -5
          else
            echo "::warning::sccache GHA cache probe failed (see above), building without cache"
            echo "SCCACHE_AVAILABLE=false" >> $GITHUB_ENV
          fi
          rm -f /tmp/sccache_test.rs /tmp/sccache_test_out

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Install trunk
        uses: taiki-e/install-action@trunk

      - name: Install tailwindcss
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.2.2/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Build MCP chart app WASM (required by kyomi-server include_str!)
        working-directory: apps/mcp-chart-app-wasm
        run: bash build.sh

      # RustEmbed's derive macro in apps/server/src/leptos_frontend.rs points at
      # crates/kyomi-ui/dist/. If the folder is missing, the macro silently
      # produces a struct without a `get()` method, causing E0599 in clippy.
      # An empty folder is enough — we don't need real assets to lint.
      - name: Ensure kyomi-ui/dist/ exists for RustEmbed
        run: mkdir -p crates/kyomi-ui/dist

      - name: Strip local-dev mold linker config
        run: sed -i '/# BEGIN_LOCAL_DEV_LINKER/,/# END_LOCAL_DEV_LINKER/d' .cargo/config.toml

      - name: cargo clippy (workspace, excluding desktop)
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo clippy --locked --workspace --exclude kyomi-desktop -- -D warnings

      # Lints test/bench targets too (the step above only covers lib+bin).
      # unwrap_used is allowed here because a panic on unwrap() in a test IS
      # the assertion — denying it in test code would force a pointless
      # rewrite of ~1000+ legitimate test unwraps. Everything else is still
      # denied, so production code (previous step) stays fully covered and
      # test code is covered by everything except this one lint.
      - name: cargo clippy (all targets, incl. tests)
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo clippy --locked --workspace --exclude kyomi-desktop --all-targets -- -D warnings -A clippy::unwrap_used

      - name: cargo clippy (kyomi-ui, wasm32)
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo clippy --locked -p kyomi-ui --target wasm32-unknown-unknown --features hydrate -- -D warnings

      - name: cargo test (unit + integration tests)
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
          # KYO-292: this job's pgvector service (above) is the only Postgres
          # kyomi-auth's postgres_* tests can reach. If it's ever unreachable
          # here, the coverage those tests exist for must fail loudly instead
          # of silently reporting `ok` via the local skip path — see
          # crates/kyomi-auth/src/test_pg.rs module docs.
          KYOMI_REQUIRE_POSTGRES_TESTS: "1"
          # KYO-257: apply_runtime_overrides() (kyomi-core/src/constants.rs)
          # only enables HSTS when FRONTEND_URL starts with "https://". This
          # value is never sent anywhere — it only feeds that starts_with()
          # check and gets appended to the CORS allow-list — so a fake
          # https:// host is fine here and lets
          # apps/server/tests/contract_health.rs::has_hsts_header_when_not_demo
          # run un-quarantined.
          FRONTEND_URL: "https://ci-test.kyomi.invalid"
        run: cargo test --locked --workspace --lib --bins --tests --exclude kyomi-desktop --exclude kyomi-datasource-server

      # The step above passes explicit target flags (--lib --bins --tests),
      # which excludes doctests entirely — cargo only compiles/runs them
      # under --doc (or no target flags at all). That gap let a doc comment
      # containing invalid standalone Rust (a Leptos view! example fenced as
      # ```rust) sit broken on `pub fn Button` for months: a bare `cargo test
      # --workspace` implicitly includes doctests among its default targets,
      # and cargo test's default fail-fast behaviour aborts that run before
      # most crates are reached (KYO-338, hit for real during KYO-286).
      - name: cargo test (doctests)
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo test --locked --workspace --doc --exclude kyomi-desktop --exclude kyomi-datasource-server

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # ---------------------------------------------------------------------------
  # SSR contract tests against a real trunk build (KYO-255)
  #
  # apps/server/tests/contract_ssr.rs asserts on the actual server-rendered
  # HTML of /login (data-ssr attribute, prerendered heading/inputs, the WASM
  # loader script, serialized resource scripts, per-response CSP nonce on
  # every inline script including the generated WASM initializer) plus the
  # CSR shell on a non-SSR route. None of that exists without a genuine
  # `trunk build` of crates/kyomi-ui/dist/ — apps/server/src/leptos_frontend.rs embeds dist/
  # via rust_embed at *compile* time, so the `mkdir -p crates/kyomi-ui/dist`
  # the clippy job uses (an empty directory, just enough for RustEmbed's
  # derive macro to compile) produces a struct with no assets.
  #
  # The tests that need real assets carry #[ignore] in the source, and
  # this job's final step passes `--include-ignored` to opt back in. That
  # split — not un-ignoring them outright — is load-bearing: the clippy job
  # above also runs `cargo test --tests`, which would pick up contract_ssr
  # along with every other integration-test target. Against clippy's empty
  # dist/ those tests would fail every PR (they did, briefly — KYO-255 first
  # landed without the #[ignore]s and broke clippy). #[ignore] keeps them
  # out of that generic sweep; this job is the only place `--include-ignored`
  # is passed, so it's the only place they run. Tests that need no dist/
  # assets are intentionally left unignored and still run in clippy's sweep.
  # Run locally with: cd crates/kyomi-ui && trunk build, then
  # cargo test -p kyomi-server --test contract_ssr -- --include-ignored.
  #
  # Why this is its own job instead of a step in `clippy` above: a cold
  # `trunk build` (wasm-dev profile, matching Trunk.toml's cargo_profile —
  # do NOT strip that setting the way release.yml does, that's there to make
  # *production* release builds pay the wasm-opt cost, not this one) was
  # measured at 13m13s — 10m37s compiling kyomi-ui to wasm32, plus 2m20s in
  # Trunk.toml's post_build hook running `brotli -q 11` over the 63 MB debug
  # wasm output. Tacking that onto clippy's already-slow 31-37 minutes would
  # push every PR to ~44-50 minutes. Run in parallel instead, this job's
  # measured cost (trunk build + server build + the contract suite) lands
  # around 20-25 minutes — shorter than clippy — so GitHub Actions runs the
  # two concurrently and the slowest one (still clippy) is what determines
  # wall-clock CI time for a PR. This job adds runner-minutes, not waiting.
  #
  # Same postgres service shape as clippy (KYO-236): credentials/db name
  # match kyomi-core's Config::test_config() default, so no DATABASE_URL
  # override is needed. Separate container from clippy's — each job gets
  # its own fresh service.
  #
  # `Install build dependencies` mirrors release.yml's job of the same name
  # (not clippy's, which additionally installs poppler-utils for
  # kyomi-agent's own tests — irrelevant here, this job only runs
  # contract_ssr). build-essential/pkg-config/libssl-dev/clang are needed
  # because kyomi-server pulls in kyomi-embed, whose candle-transformers ->
  # tokenizers -> esaxx-rs chain compiles C++ via the `cc` crate.
  #
  # `Install brotli` is the single easiest thing to get wrong here:
  # Trunk.toml's post_build hook shells out to `brotli` and `gzip` on every
  # .wasm/.js/.css it produces, and brotli is not preinstalled on any
  # existing CI job (release.yml installs it for exactly this reason —
  # clippy never needs it, since it never runs a real trunk build).
  # Without this step `trunk build` fails inside the hook, not the compile.
  # ---------------------------------------------------------------------------
  ssr-contract-tests:
    name: SSR Contract Tests
    runs-on: ubuntu-latest
    # Observed execution max: 28.2m (last ~15 runs). 60m is not a simple
    # multiple of that — it's sized to leave ~32m of deliberate headroom
    # for runner-acquisition queue delay on top of execution time, since
    # timeout-minutes counts queued time too (KYO-259 set 45m off
    # execution time alone, which left only ~17m of queue slack; KYO-322
    # corrected the basis).
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
    # postgres backs apps/server/tests/contract_ssr.rs the same way it backs
    # clippy's apps/server/tests/ suite (KYO-236) — see that job's comment
    # for why Redis is not needed here either.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: kyomi_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kyomi_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kyomi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev clang

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach GHA cache
        run: |
          echo 'fn main(){}' > /tmp/sccache_test.rs
          if sccache $(rustc --print sysroot)/bin/rustc /tmp/sccache_test.rs --crate-type bin -o /tmp/sccache_test_out; then
            echo "SCCACHE_AVAILABLE=true" >> $GITHUB_ENV
            sccache --show-stats 2>&1 | head -5
          else
            echo "::warning::sccache GHA cache probe failed (see above), building without cache"
            echo "SCCACHE_AVAILABLE=false" >> $GITHUB_ENV
          fi
          rm -f /tmp/sccache_test.rs /tmp/sccache_test_out

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Install trunk
        uses: taiki-e/install-action@trunk

      - name: Install tailwindcss
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.2.2/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Install brotli (Trunk post_build hook dependency)
        run: sudo apt-get install -y --no-install-recommends brotli

      - name: Build MCP chart app WASM (required by kyomi-server include_str!)
        working-directory: apps/mcp-chart-app-wasm
        run: bash build.sh

      - name: Strip local-dev mold linker config
        run: sed -i '/# BEGIN_LOCAL_DEV_LINKER/,/# END_LOCAL_DEV_LINKER/d' .cargo/config.toml

      # Plain `trunk build`, not --release. Trunk.toml's cargo_profile =
      # "wasm-dev" is the fast path this job's whole existence depends on —
      # do not add a `sed -i '/cargo_profile/d' Trunk.toml` step like
      # release.yml does. That step exists there to *undo* wasm-dev for
      # production artifacts; here it would turn the measured 10m37s wasm
      # compile into something much slower for no test benefit.
      - name: trunk build (crates/kyomi-ui)
        working-directory: crates/kyomi-ui
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: trunk build

      # --include-ignored: the tests in contract_ssr.rs that need a real
      # dist/ carry #[ignore] so the clippy job's `cargo test --tests` sweep
      # (which only mkdirs an empty dist/) skips them instead of failing.
      # This is the job that opts back in, now that dist/ is real.
      - name: cargo test (SSR contract tests)
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo test --locked -p kyomi-server --test contract_ssr -- --include-ignored

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # ---------------------------------------------------------------------------
  # Worktree lifecycle & script self-tests (KYO-578, KYO-617, KYO-629, KYO-632, KYO-662, KYO-679, KYO-710, KYO-733)
  #
  # Hermetic shell self-tests cover ticket lifecycle controls, lint policies,
  # tooling freshness, and real commit/amend hooks. All suites run even if an
  # earlier suite fails; the job reports every failure at the end.
  worktree-lifecycle-selftests:
    name: Worktree Lifecycle & Script Self-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 (KYO-632, same reason lint-policy above uses it):
      # scripts/lib/stale-tooling-guard.sh — sourced by twelve production
      # scripts, including the lifecycle and lint tooling below — determines
      # staleness by comparing the calling script's on-disk content
      # against the LOCAL `origin/main` ref
      # (`git show origin/main:<path>`, no `git fetch`). The default
      # actions/checkout (fetch-depth: 1) fetches only the ref under test
      # and never populates refs/remotes/origin/main at all, so without
      # this the guard would land on its "cannot determine" path — loud,
      # not silent, but the check the guard exists to perform would never
      # actually run in CI. fetch-depth: 0 fetches every branch, which is
      # what gives the guard a real origin/main to compare against here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run worktree lifecycle self-test suites
        run: |
          suites=(
            scripts/check-ticket-in-flight-test.sh
            scripts/mark-worktree-stranded-test.sh
            scripts/retire-worktree-test.sh
            scripts/mark-branch-stranded-test.sh
            scripts/append-review-log-test.sh
            scripts/audit-agent-run-deaths-test.sh
            scripts/reconcile-merged-tickets-test.sh
            scripts/preflight-clippy-test.sh
            scripts/lib/stale-tooling-guard-test.sh
            scripts/lint/check-real-identifiers-test.sh
            scripts/lint/check-disposal-safety-test.sh
            scripts/repro-headless-subagent-survival-test.sh
            scripts/check-agent-run-result-test.sh
            scripts/pre-commit-hook-test.sh
            scripts/pre-commit-amend-test.sh
            scripts/install-env-test.sh
          )
          failed=()
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            if bash "$suite"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::${suite} failed."
              failed+=("$suite")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} of ${#suites[@]} worktree lifecycle self-test suite(s) failed: ${failed[*]}"
            exit 1
          fi
          echo "✅ All ${#suites[@]} worktree lifecycle self-test suites passed."
