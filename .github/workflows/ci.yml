# =============================================================================
# Kyomi — CI (Pull Request Checks)
# =============================================================================
# Runs on every PR to main, including new pushes to existing PRs.
# Three jobs:
#   1. lint-policy (fast, ~5s) — rejects new #[allow(...)] suppressions AND
#      runs the server_fn/REST divergence linter across the full tree
#   2. trivy-scan (~30s) — Trivy filesystem vulnerability scanner (HIGH/CRITICAL)
#   3. clippy (slow, ~2-5min) — full workspace clippy + compilation check + unit tests
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Fast check: reject new lint suppressions (no Rust toolchain needed)
  # ---------------------------------------------------------------------------
  lint-policy:
    name: Lint Suppression Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject new lint suppressions
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          # Check .rs files for #[allow(...)]
          RS=$(git diff "$BASE"...HEAD -- '*.rs' | grep '^+' | grep -v '^+++' | grep '#\[allow(' || true)
          # Check Cargo.toml for = "allow" lint downgrades
          TOML=$(git diff "$BASE"...HEAD -- '*/Cargo.toml' 'Cargo.toml' | grep '^+' | grep -v '^+++' | grep '= "allow"' || true)
          if [ -n "$RS" ] || [ -n "$TOML" ]; then
            echo "::error::Lint suppressions detected. Fix the lint instead of suppressing it."
            [ -n "$RS" ] && echo "" && echo "In .rs files:" && echo "$RS"
            [ -n "$TOML" ] && echo "" && echo "In Cargo.toml:" && echo "$TOML"
            exit 1
          fi
          echo "✅ No new lint suppressions."

      # --------------------------------------------------------------------
      # Server function / REST divergence lint (KYO-122).
      #
      # Blocks two patterns that caused the KYO-70, KYO-72, KYO-115
      # outages:
      #   A) server_fns pulling non-allowlisted DI via use_context::<T>()
      #   B) server_fns doing heavy service-layer orchestration that
      #      diverges from the REST handler
      #
      # Pure bash + awk, no Rust toolchain required (~200ms).
      # --------------------------------------------------------------------
      - name: Server function / REST divergence lint
        run: ./scripts/lint/check-server-fns.sh

      # --------------------------------------------------------------------
      # Signal disposal safety lint (KYO-289).
      #
      # Blocks bare .set()/.update() inside spawn_local/deferred contexts
      # (must use .try_set()/.try_update() to avoid WASM panics when
      # signals are disposed during page navigation).
      #
      # Pure bash + awk, no Rust toolchain required (~200ms).
      # --------------------------------------------------------------------
      - name: Signal disposal safety lint
        run: ./scripts/lint/check-disposal-safety.sh

  # ---------------------------------------------------------------------------
  # Security: Trivy filesystem vulnerability scan
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

  # ---------------------------------------------------------------------------
  # Slow check: cargo clippy (compiles + lints the entire workspace)
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach GHA cache
        run: |
          echo 'fn main(){}' > /tmp/sccache_test.rs
          if sccache $(rustc --print sysroot)/bin/rustc /tmp/sccache_test.rs --crate-type bin -o /tmp/sccache_test_out; then
            echo "SCCACHE_AVAILABLE=true" >> $GITHUB_ENV
            sccache --show-stats 2>&1 | head -5
          else
            echo "::warning::sccache GHA cache probe failed (see above), building without cache"
            echo "SCCACHE_AVAILABLE=false" >> $GITHUB_ENV
          fi
          rm -f /tmp/sccache_test.rs /tmp/sccache_test_out

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Install trunk
        uses: taiki-e/install-action@trunk

      - name: Install tailwindcss
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.2.2/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Build MCP chart app WASM (required by kyomi-server include_str!)
        working-directory: apps/mcp-chart-app-wasm
        run: bash build.sh

      # RustEmbed's derive macro in apps/server/src/leptos_frontend.rs points at
      # crates/kyomi-ui/dist/. If the folder is missing, the macro silently
      # produces a struct without a `get()` method, causing E0599 in clippy.
      # An empty folder is enough — we don't need real assets to lint.
      - name: Ensure kyomi-ui/dist/ exists for RustEmbed
        run: mkdir -p crates/kyomi-ui/dist

      - name: Strip local-dev mold linker config
        run: sed -i '/# BEGIN_LOCAL_DEV_LINKER/,/# END_LOCAL_DEV_LINKER/d' .cargo/config.toml

      - name: cargo clippy (workspace, excluding desktop)
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo clippy --locked --workspace --exclude kyomi-desktop -- -D warnings

      - name: cargo clippy (kyomi-ui, wasm32)
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo clippy --locked -p kyomi-ui --target wasm32-unknown-unknown --features hydrate -- -D warnings

      - name: cargo test (workspace, excluding desktop)
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo test --locked --workspace --exclude kyomi-desktop

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

