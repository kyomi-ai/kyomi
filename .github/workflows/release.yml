# =============================================================================
# Kyomi — Release Workflow
# =============================================================================
# Triggered by version tags (v*). Builds a linux/amd64 Docker image on GHCR
# for self-hosted users and creates a GitHub Release.
#
# Usage:
#   git tag v2026.04.19.2
#   git push --tags
#
# The Leptos WASM frontend is pre-built on the amd64 runner and COPY'd into
# the Docker image. Docker builds linux/amd64 only — arm64 via QEMU timed
# out at ~85 min in initial testing (cargo build under emulation is too
# slow). Native arm64 support is tracked in KYO-112 (matrix build across
# `ubuntu-latest` + `ubuntu-24.04-arm` + docker manifest create).
#
# Desktop installers (.dmg/.msi/.AppImage) for apps/desktop are tracked in
# KYO-113. Self-hosted install is Docker-only for now.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GHCR_REGISTRY: ghcr.io/kyomi-ai
  TRUNK_VERSION: 0.21.14
  WASM_BINDGEN_VERSION: 0.2.114
  TAILWIND_VERSION: v4.2.2
  BINARYEN_VERSION: version_123

jobs:
  # ---------------------------------------------------------------------------
  # Extract version from tag
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: kyomi-ci
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Docker: linux/amd64 image
  # ---------------------------------------------------------------------------
  # Pre-builds MCP chart app + Leptos WASM dist on the amd64 runner, then
  # builds the linux/amd64 image. arm64 deferred (QEMU + cargo is too slow).
  docker:
    needs: [prepare]
    runs-on: kyomi-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Same local-dev [patch.crates-io] strip as ci.yml / apps/server/Dockerfile.
      - name: Strip local-dev patch.crates-io block
        run: |
          sed -i '/# BEGIN_LOCAL_DEV_PATCHES/,/# END_LOCAL_DEV_PATCHES/d' Cargo.toml
          sed -i '/# BEGIN_LOCAL_DEV_PATCHES/,/# END_LOCAL_DEV_PATCHES/d' apps/mcp-chart-app-wasm/Cargo.toml

      - name: Install brotli (Trunk post_build hook dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends brotli

      # Trunk resolves wasm-opt from $HOME/.cache/trunk/... — on the runner
      # that's /home/runner/.cache, which differs from apps/server/Dockerfile
      # (which runs as root and uses /root/.cache). Both are correct for
      # their respective contexts.
      - name: Install trunk + wasm-bindgen-cli + tailwindcss + wasm-opt
        run: |
          set -euo pipefail
          sudo curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trunk
          sudo curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin \
                "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
          sudo curl -fsSL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          sudo chmod +x /usr/local/bin/tailwindcss
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C /tmp
          mkdir -p "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin"
          mv "/tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" \
            "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt-real"
          printf '#!/bin/sh\nexec "%s" --enable-bulk-memory-opt --enable-nontrapping-float-to-int "$@"\n' \
            "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt-real" \
            > "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt"
          chmod +x "$HOME/.cache/trunk/wasm-opt-${BINARYEN_VERSION}/bin/wasm-opt"

      - name: Build Leptos WASM frontend
        working-directory: crates/kyomi-ui
        run: trunk build --release

      - name: Build MCP chart app WASM
        working-directory: apps/mcp-chart-app-wasm
        run: bash build.sh

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.standalone
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/kyomi:${{ needs.prepare.outputs.version }}
            ${{ env.GHCR_REGISTRY }}/kyomi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, docker]
    runs-on: kyomi-ci
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            ### Docker (recommended)
            ```bash
            docker pull ghcr.io/kyomi-ai/kyomi:${{ needs.prepare.outputs.version }}
            ```

            Then run:
            ```bash
            docker run -v kyomi-data:/data -p 3000:3000 \
              -e ANTHROPIC_API_KEY=sk-ant-... \
              ghcr.io/kyomi-ai/kyomi:${{ needs.prepare.outputs.version }}
            ```

            The image is linux/amd64 and fully self-contained — frontend,
            ML model, and server in a single binary. Requires an LLM API key
            (Anthropic, OpenAI, or Gemini). arm64 support is on the roadmap.

            See [Self-Hosting Guide](https://kyomi.ai/self-hosting) for full
            setup instructions.
