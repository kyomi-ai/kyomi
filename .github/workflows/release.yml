# =============================================================================
# Kyomi — Release Workflow
# =============================================================================
# Triggered by version tags (v*). Builds a linux/amd64 Docker image on
# GitHub-hosted runners, pushes to GHCR, produces standalone binaries,
# creates a GitHub Release, and dispatches a deploy to kyomi-private.
#
# Usage:
#   git tag v2026.05.06.1
#   git push --tags
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GHCR_REGISTRY: ghcr.io/kyomi-ai
  TRUNK_VERSION: 0.21.14
  WASM_BINDGEN_VERSION: 0.2.114
  TAILWIND_VERSION: v4.2.2
  BINARYEN_VERSION: version_128

jobs:
  # ---------------------------------------------------------------------------
  # Extract version from tag
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Docker: per-arch images
  # ---------------------------------------------------------------------------
  docker:
    needs: [prepare]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            trunk_arch: x86_64
            wasm_bindgen_arch: x86_64-unknown-linux-musl
            tailwind_binary: tailwindcss-linux-x64
            binaryen_arch: x86_64-linux
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach GHA cache
        run: |
          echo 'fn main(){}' > /tmp/sccache_test.rs
          if sccache $(rustc --print sysroot)/bin/rustc /tmp/sccache_test.rs --crate-type bin -o /tmp/sccache_test_out; then
            echo "SCCACHE_AVAILABLE=true" >> $GITHUB_ENV
            sccache --show-stats 2>&1 | head -5
          else
            echo "::warning::sccache GHA cache probe failed (see above), building without cache"
            echo "SCCACHE_AVAILABLE=false" >> $GITHUB_ENV
          fi
          rm -f /tmp/sccache_test.rs /tmp/sccache_test_out

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev clang

      - name: Strip local-dev linker and trunk profile
        run: |
          sed -i '/# BEGIN_LOCAL_DEV_LINKER/,/# END_LOCAL_DEV_LINKER/d' .cargo/config.toml
          sed -i '/cargo_profile/d' crates/kyomi-ui/Trunk.toml

      - name: Install brotli (Trunk post_build hook dependency)
        run: sudo apt-get install -y --no-install-recommends brotli

      - name: Install trunk + wasm-bindgen-cli + tailwindcss + wasm-opt
        run: |
          set -euo pipefail
          sudo curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-${{ matrix.trunk_arch }}-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trunk
          sudo curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-${{ matrix.wasm_bindgen_arch }}.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin \
                "wasm-bindgen-${WASM_BINDGEN_VERSION}-${{ matrix.wasm_bindgen_arch }}/wasm-bindgen"
          sudo curl -fsSL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/${{ matrix.tailwind_binary }}"
          sudo chmod +x /usr/local/bin/tailwindcss
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-${{ matrix.binaryen_arch }}.tar.gz" \
            | tar -xz -C /tmp
          sudo mv "/tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt

      - name: Build Leptos WASM frontend (trunk, wasm-opt disabled)
        working-directory: crates/kyomi-ui
        run: trunk build --release

      - name: Optimize WASM with wasm-opt
        run: |
          for f in crates/kyomi-ui/dist/*_bg.wasm; do
            wasm-opt --enable-bulk-memory-opt --enable-nontrapping-float-to-int -O -o "${f}.opt" "$f"
            mv "${f}.opt" "$f"
          done

      - name: Build MCP chart app WASM
        working-directory: apps/mcp-chart-app-wasm
        run: bash build.sh

      - name: Build release binary
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo build --release -p kyomi-server

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Collect runtime libs
        run: |
          set -euo pipefail
          LIBS_DIR=target/release/runtime-libs/libs
          ETC_DIR=target/release/runtime-libs/etc
          TMP_DIR=target/release/runtime-libs/tmp
          mkdir -p "$LIBS_DIR" "$ETC_DIR" "$TMP_DIR"
          ldd target/release/kyomi | awk '/=>/ {print $3}' | while read lib; do
            cp "$lib" "$LIBS_DIR/"
          done
          cp /lib64/ld-linux-x86-64.so.2 "$LIBS_DIR/"
          cp /lib/x86_64-linux-gnu/libnss_dns.so.2 "$LIBS_DIR/"
          cp /lib/x86_64-linux-gnu/libnss_files.so.2 "$LIBS_DIR/"
          cp /lib/x86_64-linux-gnu/libresolv.so.2 "$LIBS_DIR/"
          cp /etc/ssl/certs/ca-certificates.crt "$ETC_DIR/"
          printf 'hosts: files dns\n' > "$ETC_DIR/nsswitch.conf"
          touch "$TMP_DIR/.keep"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.GHCR_REGISTRY }}/kyomi:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

  # ---------------------------------------------------------------------------
  # Docker manifest: combine per-arch images into a multi-arch manifest
  # ---------------------------------------------------------------------------
  docker-manifest:
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag ${{ env.GHCR_REGISTRY }}/kyomi:${VERSION} \
            --tag ${{ env.GHCR_REGISTRY }}/kyomi:latest \
            ${{ env.GHCR_REGISTRY }}/kyomi:${VERSION}-amd64

  # ---------------------------------------------------------------------------
  # Binaries: standalone kyomi binary tarballs
  # ---------------------------------------------------------------------------
  binaries:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            trunk_arch: x86_64
            trunk_os_suffix: unknown-linux-gnu
            wasm_bindgen_arch: x86_64-unknown-linux-musl
            tailwind_binary: tailwindcss-linux-x64
            binaryen_arch: x86_64-linux
            sed_inplace: "sed -i"
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Verify sccache can reach GHA cache
        run: |
          echo 'fn main(){}' > /tmp/sccache_test.rs
          if sccache $(rustc --print sysroot)/bin/rustc /tmp/sccache_test.rs --crate-type bin -o /tmp/sccache_test_out; then
            echo "SCCACHE_AVAILABLE=true" >> $GITHUB_ENV
            sccache --show-stats 2>&1 | head -5
          else
            echo "::warning::sccache GHA cache probe failed (see above), building without cache"
            echo "SCCACHE_AVAILABLE=false" >> $GITHUB_ENV
          fi
          rm -f /tmp/sccache_test.rs /tmp/sccache_test_out

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev clang

      - name: Strip local-dev linker and trunk profile
        run: |
          ${{ matrix.sed_inplace }} '/# BEGIN_LOCAL_DEV_LINKER/,/# END_LOCAL_DEV_LINKER/d' .cargo/config.toml
          ${{ matrix.sed_inplace }} '/cargo_profile/d' crates/kyomi-ui/Trunk.toml

      - name: Install brotli (Trunk post_build hook dependency)
        run: sudo apt-get install -y --no-install-recommends brotli

      - name: Install trunk + wasm-bindgen-cli + tailwindcss + wasm-opt
        run: |
          set -euo pipefail
          sudo curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-${{ matrix.trunk_arch }}-${{ matrix.trunk_os_suffix }}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trunk
          sudo curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-${{ matrix.wasm_bindgen_arch }}.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin \
                "wasm-bindgen-${WASM_BINDGEN_VERSION}-${{ matrix.wasm_bindgen_arch }}/wasm-bindgen"
          sudo curl -fsSL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/${{ matrix.tailwind_binary }}"
          sudo chmod +x /usr/local/bin/tailwindcss
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-${{ matrix.binaryen_arch }}.tar.gz" \
            | tar -xz -C /tmp
          sudo mv "/tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt

      - name: Build Leptos WASM frontend (trunk, wasm-opt disabled)
        working-directory: crates/kyomi-ui
        run: trunk build --release

      - name: Optimize WASM with wasm-opt
        run: |
          for f in crates/kyomi-ui/dist/*_bg.wasm; do
            wasm-opt --enable-bulk-memory-opt --enable-nontrapping-float-to-int -O -o "${f}.opt" "$f"
            mv "${f}.opt" "$f"
          done

      - name: Build MCP chart app WASM
        working-directory: apps/mcp-chart-app-wasm
        run: bash build.sh

      - name: Build release binary
        env:
          RUSTC_WRAPPER: ${{ env.SCCACHE_AVAILABLE == 'true' && 'sccache' || '' }}
        run: cargo build --release -p kyomi-server

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Create tarball
        run: tar -czf kyomi-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C target/release kyomi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyomi-${{ matrix.os }}-${{ matrix.arch }}
          path: kyomi-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

  # ---------------------------------------------------------------------------
  # Deploy: notify kyomi-private to deploy from GHCR
  # ---------------------------------------------------------------------------
  deploy-notify:
    needs: [prepare, docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.ARC_APP_ID }}
          private-key: ${{ secrets.ARC_APP_PRIVATE_KEY }}
          owner: kyomi-ai
          repositories: kyomi-private

      - name: Dispatch deploy to kyomi-private
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: kyomi-ai/kyomi-private
          event-type: public-repo-updated
          client-payload: >-
            {
              "version": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}"
            }

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kyomi-linux-*
          path: artifacts/

      - name: Generate checksums
        working-directory: artifacts
        run: |
          for dir in kyomi-*/; do
            mv "$dir"/*.tar.gz .
          done
          sha256sum kyomi-*.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/kyomi-*.tar.gz
            artifacts/SHA256SUMS.txt
          body: |
            ## Installation

            ### Docker (recommended)
            ```bash
            docker pull ghcr.io/kyomi-ai/kyomi:${{ needs.prepare.outputs.version }}
            ```

            Then run:
            ```bash
            docker run -v kyomi-data:/data -p 3000:3000 \
              -e ANTHROPIC_API_KEY=sk-ant-... \
              ghcr.io/kyomi-ai/kyomi:${{ needs.prepare.outputs.version }}
            ```

            The image supports linux/amd64 and is fully
            self-contained — frontend, ML model, and server in a single binary.
            Requires an LLM API key (Anthropic, OpenAI, or Gemini).

            ### Standalone binary
            Download the tarball for your platform from the assets below,
            then extract and run:
            ```bash
            tar -xzf kyomi-<os>-<arch>.tar.gz
            ./kyomi
            ```

            See [Self-Hosting Guide](https://kyomi.ai/self-hosting) for full
            setup instructions.
