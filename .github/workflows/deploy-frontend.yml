name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/chartml-transform/**'
      - 'packages/chart-header/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: apps/frontend
        run: |
          npm install
          npm run build

      - name: Deploy frontend
        run: |
          rm -rf /www/kyomi.ai/app/*
          cp -r apps/frontend/dist/* /www/kyomi.ai/app/
          echo "Frontend deployed to /www/kyomi.ai/app"
