# =============================================================================
# Notify private repo of public repo changes
# =============================================================================
# On push to main, dispatches a repository_dispatch event to kyomi-private.
# The private repo's sync-submodule.yml workflow picks this up, bumps the
# submodule pointer, and triggers targeted deploy workflows based on which
# services have changed files.
#
# Path-to-service mapping (only services whose source lives in this repo):
#   api:        apps/server/**, crates/**, enterprise/**, Cargo.*,
#               apps/mcp-chart-app/**, data/**, packages/chart-header/**
#   frontend:   apps/frontend/**
#
# Services whose source lives exclusively in kyomi-private (chart-renderer,
# marketing, analytics-collector, k8s infra) are deployed from there and
# do not need a dispatch from this repo.
# =============================================================================

name: Notify Private Repo

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)

          has_match() {
            local pattern="$1"
            echo "$CHANGED" | grep -qE "$pattern"
          }

          API=false
          FRONTEND=false

          if has_match '^apps/server/|^crates/|^enterprise/|^Cargo\.|^apps/mcp-chart-app/|^data/|^packages/chart-header/|^packages/chartml-core/'; then
            API=true
          fi

          if has_match '^apps/frontend/'; then
            FRONTEND=true
          fi

          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"

          echo "Changed services: api=$API frontend=$FRONTEND"

      - name: Dispatch to kyomi-private
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repository: kyomi-ai/kyomi-private
          event-type: public-repo-updated
          client-payload: >-
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "services": {
                "api": ${{ steps.changes.outputs.api }},
                "frontend": ${{ steps.changes.outputs.frontend }}
              }
            }
