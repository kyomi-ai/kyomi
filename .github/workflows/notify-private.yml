# =============================================================================
# Notify private repo of a tagged release
# =============================================================================
# Triggered by pushing a version tag (v*). Dispatches a repository_dispatch
# event to kyomi-private, which bumps the submodule pointer to the tagged
# commit and runs deploy-api.yml to build + roll out the production image.
#
# Pushing to main does NOT fire this workflow — main merges are dev-only and
# do not deploy. See docs/RELEASING.md for the release flow.
#
# Only the API is dispatched from this repo. Private-only services
# (marketing, analytics-collector, k8s infra) deploy from
# their own workflows in kyomi-private when their source changes there.
# =============================================================================

name: Notify Private Repo

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to kyomi-private
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repository: kyomi-ai/kyomi-private
          event-type: public-repo-updated
          client-payload: >-
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "services": {
                "api": true
              }
            }
