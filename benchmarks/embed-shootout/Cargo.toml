[package]
name = "embed-shootout"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
# ONNX Runtime backend (via fastembed — same as production)
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }

# Candle backend (pure Rust)
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"

# Threading control for candle's matmul backend
gemm = "0.19"

# Shared
hf-hub = "0.5"
tokenizers = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
