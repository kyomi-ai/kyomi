apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-collector
  namespace: kyomi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-collector
  template:
    metadata:
      labels:
        app: analytics-collector
    spec:
      containers:
        - name: analytics-collector
          image: YOUR_REGISTRY:PORT/kyomi-analytics-collector:latest
          ports:
            - containerPort: 8003
          env:
            - name: ANALYTICS_CLICKHOUSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: kyomi-config
                  key: ANALYTICS_CLICKHOUSE_HOST
            - name: ANALYTICS_CLICKHOUSE_PORT
              valueFrom:
                configMapKeyRef:
                  name: kyomi-config
                  key: ANALYTICS_CLICKHOUSE_PORT
            - name: ANALYTICS_CLICKHOUSE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: kyomi-config
                  key: ANALYTICS_CLICKHOUSE_SECURE
            - name: ANALYTICS_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kyomi-secrets
                  key: ANALYTICS_CLICKHOUSE_PASSWORD
                  optional: true
            - name: ANALYTICS_SALT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kyomi-secrets
                  key: ANALYTICS_SALT_SECRET
                  optional: true
            - name: ANALYTICS_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: kyomi-secrets
                  key: ANALYTICS_SIGNING_SECRET
                  optional: true
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: kyomi-config
                  key: REDIS_URL
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          volumeMounts:
            - name: trust-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: trust-bundle
          configMap:
            name: kyomi-trust-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-collector
  namespace: kyomi
spec:
  selector:
    app: analytics-collector
  ports:
    - port: 8003
      targetPort: 8003
