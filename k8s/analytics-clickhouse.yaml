# Analytics ClickHouse deployment using Longhorn storage with TLS encryption.
# Certs are issued by cert-manager (see cert-manager.yaml).
# Serves Kyomi Analytics event storage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: kyomi
data:
  logging.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
        <console>true</console>
      </logger>
      <query_log remove="remove"/>
      <query_thread_log remove="remove"/>
      <part_log remove="remove"/>
      <metric_log remove="remove"/>
      <asynchronous_metric_log remove="remove"/>
      <trace_log remove="remove"/>
    </clickhouse>
  user-logging.xml: |
    <clickhouse>
      <profiles>
        <default>
          <log_queries>0</log_queries>
          <log_query_threads>0</log_query_threads>
        </default>
      </profiles>
    </clickhouse>
  tls.xml: |
    <clickhouse>
      <https_port>8443</https_port>
      <http_port remove="remove"/>
      <openSSL>
        <server>
          <certificateFile>/tls/tls.crt</certificateFile>
          <privateKeyFile>/tls/tls.key</privateKeyFile>
          <caConfig>/tls/ca.crt</caConfig>
        </server>
      </openSSL>
    </clickhouse>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-clickhouse
  namespace: kyomi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: analytics-clickhouse
  template:
    metadata:
      labels:
        app: analytics-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: docker.io/clickhouse/clickhouse-server:26.1-alpine
          ports:
            - containerPort: 8443
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kyomi-secrets
                  key: ANALYTICS_CLICKHOUSE_PASSWORD
                  optional: true
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.d/logging.xml
              subPath: logging.xml
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/users.d/logging.xml
              subPath: user-logging.xml
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.d/tls.xml
              subPath: tls.xml
            - name: clickhouse-tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: clickhouse-data
          persistentVolumeClaim:
            # Legacy PVC name kept to preserve existing data volume
            claimName: plausible-clickhouse-data-longhorn
        - name: clickhouse-config
          configMap:
            name: clickhouse-config
        - name: clickhouse-tls
          projected:
            sources:
              - secret:
                  name: analytics-clickhouse-tls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - secret:
                  name: kyomi-internal-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-clickhouse
  namespace: kyomi
spec:
  selector:
    app: analytics-clickhouse
  ports:
    - port: 8443
      targetPort: 8443
