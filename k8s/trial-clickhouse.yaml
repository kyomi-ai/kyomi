# Trial ClickHouse deployment using Longhorn storage with TLS encryption.
# Certs are issued by cert-manager (see cert-manager.yaml).
# The sample_readonly user is defined declaratively via users.d config so it survives
# pod restarts. An init container generates the XML from the k8s secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trial-clickhouse-config
  namespace: kyomi
data:
  tls.xml: |
    <clickhouse>
      <https_port>8443</https_port>
      <http_port remove="remove"/>
      <openSSL>
        <server>
          <certificateFile>/tls/tls.crt</certificateFile>
          <privateKeyFile>/tls/tls.key</privateKeyFile>
          <caConfig>/tls/ca.crt</caConfig>
        </server>
      </openSSL>
    </clickhouse>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trial-clickhouse
  namespace: kyomi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trial-clickhouse
  template:
    metadata:
      labels:
        app: trial-clickhouse
    spec:
      initContainers:
        - name: create-user-config
          image: docker.io/clickhouse/clickhouse-server:26.1-alpine
          command: ["sh", "-c"]
          args:
            - |
              PASSWORD_HASH=$(echo -n "$SAMPLE_CLICKHOUSE_PASSWORD" | sha256sum | cut -d' ' -f1)
              cat > /etc/clickhouse-server/users.d/sample_readonly.xml <<EOF
              <clickhouse>
                <users>
                  <sample_readonly>
                    <password_sha256_hex>${PASSWORD_HASH}</password_sha256_hex>
                    <networks>
                      <ip>::/0</ip>
                    </networks>
                    <profile>readonly</profile>
                    <quota>default</quota>
                    <allow_databases>
                      <database>acme_analytics</database>
                    </allow_databases>
                  </sample_readonly>
                </users>
              </clickhouse>
              EOF
          env:
            - name: SAMPLE_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kyomi-secrets
                  key: SAMPLE_CLICKHOUSE_PASSWORD
          volumeMounts:
            - name: clickhouse-users-config
              mountPath: /etc/clickhouse-server/users.d
      containers:
        - name: clickhouse
          image: docker.io/clickhouse/clickhouse-server:26.1-alpine
          ports:
            - containerPort: 8443
              name: https
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_DB
              valueFrom:
                configMapKeyRef:
                  name: kyomi-config
                  key: SAMPLE_CLICKHOUSE_DATABASE
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-users-config
              mountPath: /etc/clickhouse-server/users.d
            - name: trial-clickhouse-config
              mountPath: /etc/clickhouse-server/config.d/tls.xml
              subPath: tls.xml
            - name: clickhouse-tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "1000m"
      volumes:
        - name: clickhouse-data
          persistentVolumeClaim:
            claimName: trial-clickhouse-data-longhorn
        - name: clickhouse-users-config
          emptyDir: {}
        - name: trial-clickhouse-config
          configMap:
            name: trial-clickhouse-config
        - name: clickhouse-tls
          projected:
            sources:
              - secret:
                  name: trial-clickhouse-tls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - secret:
                  name: kyomi-internal-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: trial-clickhouse
  namespace: kyomi
spec:
  selector:
    app: trial-clickhouse
  ports:
    - port: 8443
      targetPort: 8443
      name: https
    - port: 9000
      targetPort: 9000
      name: native
