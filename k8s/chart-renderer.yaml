apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart-renderer
  namespace: kyomi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chart-renderer
  template:
    metadata:
      labels:
        app: chart-renderer
    spec:
      containers:
        - name: chart-renderer
          image: YOUR_REGISTRY:PORT/kyomi-chart-renderer:latest
          ports:
            - containerPort: 3030
          env:
            - name: CHART_RENDERER_PORT
              valueFrom:
                configMapKeyRef:
                  name: kyomi-config
                  key: CHART_RENDERER_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: kyomi-config
                  key: NODE_ENV
          readinessProbe:
            httpGet:
              path: /health
              port: 3030
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3030
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: chart-renderer
  namespace: kyomi
spec:
  selector:
    app: chart-renderer
  ports:
    - port: 3030
      targetPort: 3030
