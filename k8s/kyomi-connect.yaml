apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyomi-connect
  namespace: kyomi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kyomi-connect
  template:
    metadata:
      labels:
        app: kyomi-connect
    spec:
      containers:
        - name: kyomi-connect
          image: ghcr.io/kyomi-ai/kyomi-connect:latest
          env:
            - name: KYOMI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kyomi-connect-secret
                  key: KYOMI_TOKEN
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "kyomi"
            - name: DB_USER
              value: "kyomi"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kyomi-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_SSL_MODE
              value: "require"
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          volumeMounts:
            - name: trust-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: trust-bundle
          configMap:
            name: kyomi-trust-bundle
