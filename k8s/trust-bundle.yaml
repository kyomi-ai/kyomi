# CA trust bundle — distributes a combined CA bundle to consumer pods.
#
# trust-manager merges public CAs (for outbound TLS to Anthropic, Stripe, etc.)
# with our internal CA (for Redis/Postgres TLS) into a single ConfigMap.
# Pods mount this ConfigMap at /etc/ssl/certs/ca-certificates.crt and set
# SSL_CERT_FILE so rustls trusts both public and internal services.
#
# Prerequisites:
#   helm install trust-manager jetstack/trust-manager \
#     --namespace cert-manager --set app.trust.namespace=kyomi

apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: kyomi-trust-bundle
spec:
  sources:
    - useDefaultCAs: true # Public CAs (Let's Encrypt, etc.)
    - secret:
        name: kyomi-internal-ca # Our internal CA from cert-manager
        key: ca.crt
  target:
    configMap:
      key: ca-certificates.crt # Combined PEM bundle
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kyomi
