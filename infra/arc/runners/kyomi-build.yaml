# Runner Scale Set: kyomi-build
# Release build runners with Docker-in-Docker for building + pushing images.
#
# Install:
#   helm install kyomi-build \
#     --namespace arc-runners --create-namespace \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#     -f kyomi-build.yaml

githubConfigUrl: "https://github.com/kyomi-ai"
githubConfigSecret: arc-github-app

# Capped at 1: two concurrent cold-cache cargo builds would leave <4 cores
# for system services on the 16-core prod node, risking Longhorn iSCSI timeouts.
minRunners: 0
maxRunners: 1

runnerGroup: "default"
runnerScaleSetName: "kyomi-build"

# Docker-in-Docker mode — runs a Docker daemon sidecar so the runner
# can use `docker build`, `docker push`, and buildx.
containerMode:
  type: "dind"

template:
  spec:
    initContainers:
      - name: fix-cargo-cache-perms
        image: busybox
        command: ["sh", "-c", "chown -R 1001:1001 /opt/cargo-cache"]
        volumeMounts:
          - name: cargo-cache
            mountPath: /opt/cargo-cache
      - name: configure-docker-daemon
        image: busybox
        command:
          - sh
          - -c
          - |
            mkdir -p /etc/docker
            echo '{"insecure-registries": ["192.168.1.100:6145"]}' > /etc/docker/daemon.json
        volumeMounts:
          - name: docker-config
            mountPath: /etc/docker
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: CARGO_HOME
            value: /opt/cargo-cache
        resources:
          limits:
            cpu: "8"
            memory: 16Gi
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: cargo-cache
            mountPath: /opt/cargo-cache
      - name: dind
        image: docker:dind
        securityContext:
          privileged: true
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-storage
            mountPath: /var/lib/docker
          - name: docker-config
            mountPath: /etc/docker
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-storage
        emptyDir: {}
      - name: cargo-cache
        hostPath:
          path: /opt/kyomi-ci/cargo-cache
          type: DirectoryOrCreate
      - name: docker-config
        emptyDir: {}
